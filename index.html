         <UserCircle size={18} className="group-hover:scale-110 transition-transform"/>
        </button>
        <button onClick={exportProfessionalExcel} className="flex items-center justify-center p-2 md:p-2.5 text-emerald-400 hover:text-white hover:bg-emerald-600/30 rounded-xl font-bold transition-all" title={t.export}>
         <Download size={18}/>
        </button>
        <button onClick={clearAll} className="flex items-center justify-center p-2 md:p-2.5 text-rose-400 hover:text-white hover:bg-rose-600/30 rounded-xl font-bold transition-all group" title={t.reset}>
         <RefreshCcw size={18} className="group-hover:-rotate-180 transition-transform duration-500"/>
        </button>
        <button onClick={() => setShowInfo(true)} className="flex items-center justify-center p-2 md:p-2.5 text-slate-400 hover:text-white hover:bg-slate-600/30 rounded-xl font-bold transition-all" title={t.infoBtn}>
         <InfoIcon size={18}/>
        </button>
       </div>
      </header>
      <div className="grid lg:grid-cols-4 gap-4 md:gap-6">
       <div className={`${gameMode === '1v1' ? 'lg:col-span-4' : 'lg:col-span-3'} bg-[#0f172a] border border-slate-700/50 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] overflow-hidden animate-slide-up delay-100 flex flex-col max-h-[75vh]`}>
        <div className="overflow-x-auto overflow-y-auto flex-1 bg-[#0f172a]">
         <table className="w-full text-xs md:text-sm border-collapse">
          <thead className="sticky top-0 z-40 bg-[#0f172a] shadow-[0_5px_15px_rgba(0,0,0,0.8)] border-b border-slate-700">
           {gameMode === '1v1' && matchStatus1v1 && (
            <tr>
              <th colSpan={players.length + 1} className="py-2 bg-slate-900 border-b border-slate-700 shadow-inner">
               <div className="flex justify-center items-center gap-6">
                 <button onClick={() => setViewSet(v => Math.max(1, v - 1))} className="text-slate-400 hover:text-cyan-400 px-3 font-black text-xl hover:bg-slate-800 rounded transition-colors">&lt;</button>
                 <span className="text-cyan-400 font-black text-base uppercase tracking-[0.2em] min-w-[80px] text-center drop-shadow-md">SET {viewSet}</span>
                 <button onClick={() => setViewSet(v => Math.min(soloMatchBO, v + 1))} className="text-slate-400 hover:text-cyan-400 px-3 font-black text-xl hover:bg-slate-800 rounded transition-colors">&gt;</button>
               </div>
               <div className="mt-2 flex flex-col xl:flex-row justify-center items-center gap-2 xl:gap-8 px-4 border-t border-slate-800/50 pt-2 pb-1">
                 <div className="flex flex-wrap items-center gap-2 justify-center">
                   <span className="text-[10px] text-red-500/80 font-black uppercase tracking-widest flex items-center gap-1 drop-shadow-md"><XIcon size={12}/>{" "}{players[0]} BAN:</span>
                   <div className="w-[110px] md:w-[140px]"><SearchableMapSelect currentMapId={bannedMaps[viewSet]?.[0]?.[0]} selectedMaps={[]} bannedMaps={currentSetBans} onChange={(id) => handleBanChange(viewSet, 0, 0, id)} lang={lang} t={t} isBan={true} /></div>
                   <div className="w-[110px] md:w-[140px]"><SearchableMapSelect currentMapId={bannedMaps[viewSet]?.[0]?.[1]} selectedMaps={[]} bannedMaps={currentSetBans} onChange={(id) => handleBanChange(viewSet, 0, 1, id)} lang={lang} t={t} isBan={true} /></div>
                 </div>
                 <div className="hidden xl:block w-px h-6 bg-slate-700/50"></div>
                 <div className="flex flex-wrap items-center gap-2 justify-center">
                   <span className="text-[10px] text-red-500/80 font-black uppercase tracking-widest flex items-center gap-1 drop-shadow-md"><XIcon size={12}/>{" "}{players[1]} BAN:</span>
                   <div className="w-[110px] md:w-[140px]"><SearchableMapSelect currentMapId={bannedMaps[viewSet]?.[1]?.[0]} selectedMaps={[]} bannedMaps={currentSetBans} onChange={(id) => handleBanChange(viewSet, 1, 0, id)} lang={lang} t={t} isBan={true} /></div>
                   <div className="w-[110px] md:w-[140px]"><SearchableMapSelect currentMapId={bannedMaps[viewSet]?.[1]?.[1]} selectedMaps={[]} bannedMaps={currentSetBans} onChange={(id) => handleBanChange(viewSet, 1, 1, id)} lang={lang} t={t} isBan={true} /></div>
                 </div>
               </div>
              </th>
            </tr>
           )}
           <tr>
            <th className="px-1 md:px-4 py-3 text-left w-32 md:w-64 tracking-widest text-slate-300 font-bold whitespace-nowrap pl-4">{t.match}</th>
            {players.map((p, i) => {
             const halfLen = Math.floor(players.length / 2);
             const isT1 = i < halfLen;
             const isPicker = nextPickerData && nextPickerData.show && (nextPickerData.pIndex === i || (nextPickerData.isT1 !== undefined && nextPickerData.isT1 === isT1));
             return (
              <th key={i} className={`px-1 md:px-2 py-3 min-w-[80px] md:min-w-[140px] relative group border-b-2 bg-[#0f172a] ${isPicker ? 'bg-purple-900/30 border-purple-500' : isTeamMode ? (isT1 ? 'border-blue-500/50 bg-blue-900/10' : 'border-red-500/50 bg-red-900/10') : 'border-slate-800 bg-[#0f172a]'}`}>
               {isPicker && (<div className="absolute top-1 left-1 md:left-2 text-[8px] md:text-[9px] bg-purple-600 text-white px-1.5 py-0.5 rounded animate-pulse shadow-[0_0_8px_#9333ea] z-10 pointer-events-none font-black tracking-widest flex items-center gap-0.5"><span>🎯</span>{" "}<span className="hidden sm:inline">{t.pick}</span></div>)}
               <BufferedInput value={p} onSave={val => renamePlayer(i, val)} className={`w-full bg-transparent border-b-2 outline-none text-center pb-1 text-sm md:text-lg font-bold hover:border-slate-400 font-sans ${isPicker ? 'text-purple-300 border-purple-500 focus:border-purple-400' : isTeamMode ? isT1 ? 'text-blue-100 border-slate-700 focus:border-blue-500' : 'text-red-100 border-slate-700 focus:border-red-500' : 'text-white border-slate-700 focus:border-cyan-400'}`} />
               {gameMode !== '1v1' && (<button onClick={() => removePlayer(i)} className="absolute top-1 right-1 p-1 text-slate-500 hover:text-white hover:bg-red-500 opacity-100 md:opacity-0 group-hover:opacity-100 transition-all bg-slate-800 rounded-full border border-slate-700 shadow-lg z-10"><XIcon size={10}/></button>)}
              </th>
             )
            })}
           </tr>
          </thead>
          <tbody className="divide-y divide-slate-800/50 bg-slate-900/50">
           {games.map((game, gIndex) => {
            if (gameMode === '1v1' && matchStatus1v1) { if (matchStatus1v1.gameAssignments[gIndex]?.set !== viewSet) return null; }
            const calcs = getGameCalculations(gIndex, game.times);
            let rowSelectedMaps = selectedMaps; let rowBannedMaps = [];
            if (gameMode === '1v1' && matchStatus1v1) {
              const assign = matchStatus1v1.gameAssignments[gIndex];
              if (assign) {
                if (assign.set >= 3) rowSelectedMaps = matchStatus1v1.mapsUsedSet3; else rowSelectedMaps = matchStatus1v1.mapsUsedSet12;
                rowBannedMaps = getBannedMapsForSet(assign.set);
              }
            }
            return (
             <tr key={game.id} className="hover:bg-slate-800/80 transition-all duration-200 group">
              <td className="px-1 md:px-4 py-2 relative w-[250px]">
               <div className="flex flex-col gap-0.5 md:gap-1 pl-2">
                <div className="flex items-center justify-between">
                 <span className="text-[9px] md:text-[10px] text-slate-500 font-bold uppercase tracking-widest">{gameMode === '1v1' && matchStatus1v1?.gameAssignments[gIndex] ? `S${matchStatus1v1.gameAssignments[gIndex].set} - G${matchStatus1v1.gameAssignments[gIndex].round}` : `${t.defGame} ${gIndex + 1}`}</span>
                 <div className="flex items-center gap-1.5 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                  <button onClick={() => { window.open(`${window.location.pathname}?broadcast=true&tab=prematch&gameIndex=${gIndex}`, '_blank'); }} className="text-purple-400 hover:text-purple-200 cursor-pointer flex-shrink-0" title="Mở tab Trước Trận ván này">
                    <PlayIcon size={14} className="md:w-[15px] md:h-[15px]"/>
                  </button>
                  <button onClick={() => { window.open(`${window.location.pathname}?broadcast=true&tab=postmatch&gameIndex=${gIndex}`, '_blank'); }} className="text-emerald-400 hover:text-emerald-200 cursor-pointer flex-shrink-0" title="Mở tab Sau Trận ván này">
                    <Trophy size={14} className="md:w-[15px] md:h-[15px]"/>
                  </button>
                  {gameMode !== '1v1' && (<button onClick={() => removeGame(gIndex)} className="text-slate-600 hover:text-red-500 cursor-pointer flex-shrink-0" title="Xóa trận"><Trash2 size={12} className="md:w-[14px] md:h-[14px]"/></button>)}
                 </div>
                </div>
                <SearchableMapSelect gameIndex={gIndex} currentMapId={game.mapId} selectedMaps={rowSelectedMaps} bannedMaps={rowBannedMaps} onChange={id => updateGame(gIndex, current => ({ ...current, mapId: id }))} lang={lang} t={t} />
               </div>
              </td>
              {game.times.map((time, pIndex) => {
               if (pIndex >= players.length) return null;
               const { score, isKingMap, colorClass } = calcs[pIndex];
               return (
                <td key={pIndex} className={`px-1 md:px-2 py-2 relative z-10 ${(isTeamMode || gameMode === '1v1') && pIndex === Math.floor(players.length / 2) ? 'border-l-2 border-slate-700/50 bg-black/10' : ''}`}>
                 <div className={`relative flex flex-col gap-0.5 md:gap-1 p-1 md:p-2 rounded md:rounded-lg border transition-all duration-300 hover:bg-white/[0.05] hover:-translate-y-[1px] ${colorClass}`}>
                  {isKingMap && (<div className="absolute -top-2 md:-top-3 left-1/2 -translate-x-1/2 flex items-center gap-0.5 bg-red-600 px-1 md:px-2 rounded text-[7px] md:text-[9px] uppercase font-bold tracking-widest text-white shadow-[0_0_15px_#dc2626] z-10 whitespace-nowrap animate-pulse"><Crown size={8} className="md:w-[10px] md:h-[10px]" />{" "}<span className="hidden sm:inline">{t.kingMap}</span></div>)}
                  <input type="text" value={time} onChange={(e) => handleTimeChange(gIndex, pIndex, e.target.value)} onBlur={e => handleTimeBlur(gIndex, pIndex, e.target.value)} onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); }} placeholder="X" className={`w-full text-center bg-black/40 border border-slate-700 rounded px-1 py-1 outline-none tracking-widest text-xs md:text-sm transition-all duration-300 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 hover:border-slate-500 hover:bg-black/60 ${time ? 'text-white' : 'text-slate-600'}`} />
                  <div className="mt-0.5 text-center py-0.5 rounded text-[10px] md:text-sm tracking-wider font-bold">{time ? `+${score}` : '-'}</div>
                 </div>
                </td>
               );
              })}
             </tr>
            );
           })}
          </tbody>
         </table>
        </div>
        <div className="bg-[#0f172a] shadow-[0_-10px_30px_rgba(0,0,0,0.5)] border-t border-slate-700 z-30 shrink-0 overflow-hidden">
         {gameMode === '1v1' && matchStatus1v1 ? (
          render1v1Score(players, matchStatus1v1, "flex w-full h-16 bg-[#0ea5e9] items-center justify-between px-2 md:px-8 text-white font-black shadow-[inset_0_5px_20px_rgba(2,132,199,0.8)]")
         ) : (
          <table className="w-full text-xs md:text-sm border-collapse">
           <tbody>
            <tr className={`border-t-4 border-red-600 ${isTeamMode ? 'border-b border-slate-700/50' : ''}`}>
             <td className={`px-2 md:px-4 py-2 md:py-3 text-right font-black uppercase tracking-widest w-[128px] md:w-[240px] ${isTeamMode ? 'text-[10px] md:text-xs text-slate-400' : 'text-xs md:text-sm text-red-500'}`}>{isTeamMode ? t.indivTotal : t.total}</td>
             <td className="p-0">
              <div className="flex w-full">
               {totals.map((total, i) => {
                if (i >= players.length) return null;
                return (
                <div key={i} className={`flex-1 px-1 md:px-2 py-2 md:py-3 text-center border-white/5 ${isTeamMode && i === Math.floor(players.length/2) ? 'border-l-2 border-slate-700/50' : 'border-l'}`}>
                 <span className={`${isTeamMode ? 'text-sm md:text-lg font-bold text-slate-400 drop-shadow-none' : 'text-lg md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400 drop-shadow-[0_0_15px_rgba(255,255,255,0.4)] cursor-default'}`}>{total}</span>
                </div>
               )})}
              </div>
             </td>
            </tr>
            {isTeamMode && (
             <tr className="border-t border-amber-500/50 shadow-[0_-5px_20px_rgba(245,158,11,0.2)]">
              <td className="px-2 md:px-4 py-2 md:py-3 text-right font-black text-amber-500 uppercase tracking-widest text-xs md:text-sm w-[128px] md:w-[240px]">{t.teamTotal}</td>
              <td className="p-0">
               <div className="flex w-full">
                 <div className="flex-1 px-1 md:px-2 py-1.5 md:py-2 flex flex-col items-center justify-center border-l-2 border-amber-500/30">
                  <BufferedInput value={team1Name} onSave={val => setTeam1Name(val)} placeholder={t.team1} className="w-[90%] max-w-[150px] bg-transparent text-center text-[10px] md:text-xs font-bold text-blue-300 uppercase tracking-widest outline-none border-b border-dashed border-blue-900/50 focus:border-blue-400 transition-colors mb-0.5 md:mb-1 placeholder:text-blue-400/50 font-sans" />
                  <span className="text-xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-b from-blue-200 to-blue-500 drop-shadow-[0_0_20px_rgba(59,130,246,0.6)] cursor-default leading-none">{totals.filter((_, i) => i < Math.floor(players.length/2)).reduce((a, b) => a + b, 0)}</span>
                 </div>
                 <div className="flex-1 px-1 md:px-2 py-1.5 md:py-2 flex flex-col items-center justify-center border-l-2 border-amber-500/30">
                  <BufferedInput value={team2Name} onSave={val => setTeam2Name(val)} placeholder={t.team2} className="w-[90%] max-w-[150px] bg-transparent text-center text-[10px] md:text-xs font-bold text-red-300 uppercase tracking-widest outline-none border-b border-dashed border-red-900/50 focus:border-red-400 transition-colors mb-0.5 md:mb-1 placeholder:text-red-400/50 font-sans" />
                  <span className="text-xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-b from-red-200 to-red-500 drop-shadow-[0_0_20px_rgba(239,68,68,0.6)] cursor-default leading-none">{totals.filter((_, i) => i >= Math.floor(players.length/2)).reduce((a, b) => a + b, 0)}</span>
                 </div>
               </div>
              </td>
             </tr>
            )}
           </tbody>
          </table>
         )}
        </div>
       </div>
       {gameMode !== '1v1' && (
         <div className="lg:col-span-1 animate-slide-up delay-200 order-first lg:order-last flex flex-col gap-4">
          <div className="bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 rounded-xl overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.6)]">
           <div className="bg-slate-950 px-4 md:px-6 py-3 border-b border-slate-800 flex items-center justify-between">
            <h2 className="font-black text-white tracking-[0.1em] uppercase italic transform skew-x-[-10deg] text-sm md:text-base cursor-default">{t.leaderboard}</h2>
            <Flame className="text-red-500 animate-pulse w-4 h-4" />
           </div>
           <div className="p-2 md:p-3 space-y-2 flex flex-row lg:flex-col overflow-x-auto lg:overflow-x-visible hide-scrollbar">
            {activeLeaderboard.map((item) => {
             const isTop1 = item.rank === 1 && item.score > 0;
             const isTop2 = item.rank === 2 && item.score > 0;
             const isTop3 = item.rank === 3 && item.score > 0;
             const isPicker = nextPickerData && nextPickerData.show && ((isTeamMode && nextPickerData.isT1 === item.isT1) || (!isTeamMode && nextPickerData.pIndex === item.oIndex));
             return (
              <div key={item.id} className={`relative flex items-center justify-between p-2 rounded border min-w-[140px] lg:min-w-0 flex-shrink-0 cursor-default ${isTop1 ? 'bg-amber-500/10 border-amber-500 shadow-[inset_0_0_15px_rgba(251,191,36,0.15)]' : isTop2 ? 'bg-slate-400/10 border-slate-400' : isTop3 ? 'bg-orange-700/10 border-orange-600' : 'bg-slate-950/50 border-slate-800'}`}>
               <div className={`absolute left-0 top-0 bottom-0 w-1 rounded-l ${isTop1?'bg-amber-400':isTop2?'bg-slate-300':isTop3?'bg-orange-500':'bg-slate-700'}`}></div>
               <div className="flex items-center gap-2 pl-2 min-w-0 flex-1">
                <div className={`flex-shrink-0 w-6 h-6 rounded bg-black/50 border flex items-center justify-center font-black italic text-xs shadow-inner ${isTop1 ? 'text-amber-400 border-amber-500/50' : isTop2 ? 'text-slate-300 border-slate-400/50' : isTop3 ? 'text-orange-400 border-orange-500/50' : 'text-slate-600 border-slate-700'}`}>#{item.rank}</div>
                <div className="flex flex-col">
                 <span className={`font-bold tracking-wider text-xs truncate max-w-[100px] ${isTop1 ? 'text-white' : 'text-slate-300'}`}>{item.name}</span>
                 {isTeamMode && <span className="text-[9px] text-slate-500 truncate max-w-[100px]">{item.playersStr}</span>}
                </div>
               </div>
               <div className="flex items-baseline gap-1 flex-shrink-0">
                <span className={`text-lg font-black ${isTop1 ? 'text-amber-400 drop-shadow-[0_0_10px_rgba(251,191,36,0.8)]' : 'text-white'}`}>{item.score}</span>
                <span className="text-[9px] text-slate-500 font-bold hidden sm:inline">{t.pts}</span>
               </div>
               {isPicker && (<div className="absolute -top-3 -right-2 bg-purple-600 border border-purple-400 px-2 py-0.5 rounded text-[9px] font-black uppercase text-white shadow-[0_0_10px_#9333ea] animate-pulse whitespace-nowrap z-20 flex items-center gap-1">🎯 {t.pick}</div>)}
              </div>
             );
            })}
           </div>
          </div>
         </div>
       )}
      </div>
     </div>
    </div>
   );
  }
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  </script>
</body>
</html>
