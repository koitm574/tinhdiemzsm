    };

    const BROADCAST_BACKGROUND_IMAGE = 'https://i.ibb.co/TxWgMDKd/Untitled.png';
    const NORMAL_TOP_SCORE = 11;
    const KING_TOP_SCORE = 12;
    const MAX_PLAYERS = 6;

    const getMapName = (id, lang) => {
      const mapLang = lang === 'th' ? 'en' : lang;
      for (const group of MAP_POOL) {
        const found = group.maps.find(m => m.id === id);
        if (found) return found[mapLang];
      }
      return '';
    };

    const getMapStars = (id) => {
      for (const group of MAP_POOL) {
        const found = group.maps.find(m => m.id === id);
        if (found) return group.stars;
      }
      return 0;
    };

    const parseTime = (val) => {
      if (!val || val.toUpperCase() === 'X') return null;
      if (val.includes(':') || val.includes('.')) {
        let m = 0, s = 0, c = 0;
        const parts = val.replace(',', '.').split(/[:.]/);
        if (parts.length === 3) [m, s, c] = parts.map(Number);
        else if (parts.length === 2) [s, c] = parts.map(Number);
        else return null;
        if (isNaN(m) || isNaN(s) || isNaN(c)) return null;
        return (m * 60000) + (s * 1000) + (c * 10);
      }
      const digits = val.replace(/\D/g, '');
      if (!digits) return null;
      let m = 0, s = 0, c = 0;
      if (digits.length >= 5) {
        c = Number(digits.slice(-2)); s = Number(digits.slice(-4, -2)); m = Number(digits.slice(0, -4));
      } else if (digits.length >= 3) {
        c = Number(digits.slice(-2)); s = Number(digits.slice(0, -2));
      } else {
        c = Number(digits);
      }
      return (m * 60000) + (s * 1000) + (c * 10);
    };

    const formatTimeDisplay = (val) => {
      if (!val) return '';
      if (val.toUpperCase() === 'X') return 'X';
      const ms = parseTime(val);
      if (ms === null) return val; 
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const c = Math.floor((ms % 1000) / 10);
      return `${m}:${s.toString().padStart(2, '0')}.${c.toString().padStart(2, '0')}`;
    };

    const getMapGradient = (mapId) => {
      if (!mapId) return '';
      let hash = 0;
      for (let i = 0; i < mapId.length; i++) hash = mapId.charCodeAt(i) + ((hash << 5) - hash);
      const h1 = Math.abs(hash % 360);
      const h2 = (h1 + 40) % 360;
      return `linear-gradient(135deg, hsl(${h1}, 40%, 30%), hsl(${h2}, 50%, 20%))`;
    };

    const getMapBackgroundStyle = (mapId) => {
      if (!mapId) return {};
      if (MAP_BACKGROUNDS[mapId]) {
        return {
          backgroundImage: `url(${MAP_BACKGROUNDS[mapId]})`,
          backgroundSize: 'cover',
          backgroundPosition: 'center'
        };
      }
      return { background: getMapGradient(mapId) };
    };

    const SearchableMapSelect = ({ currentMapId, selectedMaps = [], bannedMaps = [], onChange, lang, t, isBan = false }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const wrapperRef = useRef(null);

      useEffect(() => {
        function handleClickOutside(event) {
          if (wrapperRef.current && !wrapperRef.current.contains(event.target)) { setIsOpen(false); setSearchTerm(''); }
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const currentName = currentMapId ? getMapName(currentMapId, lang) : '';

    const AutoFitText = ({ text }) => {
      const containerRef = useRef(null);
      const textRef = useRef(null);
      useEffect(() => {
        const resize = () => {
          window.requestAnimationFrame(() => {
            if (containerRef.current && textRef.current) {
              textRef.current.style.transform = 'none';
              const containerWidth = containerRef.current.clientWidth;
              const textWidth = textRef.current.scrollWidth;
              if (textWidth > containerWidth && containerWidth > 0) {
                const scale = (containerWidth / textWidth) * 0.95; 
                textRef.current.style.transform = `scale(${scale})`;
              }
            }
          });
        };
        resize();
        const observer = new ResizeObserver(resize);
        if (containerRef.current) observer.observe(containerRef.current);
        return () => observer.disconnect();
      }, [text]);
      return (
        <div ref={containerRef} className="w-full flex justify-center items-end overflow-visible">
          <span ref={textRef} className="text-[9px] md:text-[11px] font-black text-cyan-300 uppercase tracking-widest drop-shadow-[0_2px_4px_rgba(0,0,0,1)] origin-bottom whitespace-nowrap transition-transform duration-200">{text}</span>

    const WheelModal = ({ lang, setActiveSidebarMenu, showDialogAlert }) => {
         const wt = {
             vi: { title: "Vòng Quay Map Random", diff: "Độ khó", count: "Số lượng Map", countPh: "Tất cả", create: "🔄 Tạo Vòng Quay", spin: "QUAY NGAY", spinning: "Đang quay...", close: "Đóng", err: "Vui lòng chọn ít nhất 1 độ khó!" },
             en: { title: "Random Map Wheel", diff: "Difficulty", count: "Map Count", countPh: "All", create: "🔄 Create Wheel", spin: "SPIN NOW", spinning: "Spinning...", close: "Close", err: "Please select at least 1 difficulty!" },
             cn: { title: "随机赛道转盘", diff: "难度", count: "赛道数量", countPh: "全部", create: "🔄 创建转盘", spin: "开始旋转", spinning: "旋转中...", close: "关闭", err: "请至少选择1个难度！" },
             tw: { title: "隨機賽道轉盤", diff: "難度", count: "賽道數量", countPh: "全部", create: "🔄 創建轉盤", spin: "開始旋轉", spinning: "旋轉中...", close: "關閉", err: "請至少選擇1個難度！" },
             th: { title: "วงล้อแผนที่สุ่ม", diff: "ความยาก", count: "จำนวนแผนที่", countPh: "ทั้งหมด", create: "🔄 สร้างวงล้อ", spin: "หมุนเลย", spinning: "กำลังหมุน...", close: "ปิด", err: "โปรดเลือกความยากอย่างน้อย 1 ระดับ!" }
         }[lang] || { title: "Vòng Quay Map Random", diff: "Độ khó", count: "Số lượng Map", countPh: "Tất cả", create: "🔄 Tạo Vòng Quay", spin: "QUAY NGAY", spinning: "Đang quay...", close: "Đóng", err: "Vui lòng chọn ít nhất 1 độ khó!" };

         const [selectedStars, setSelectedStars] = useState([7, 6, 5, 4, 3]);
         const [mapCount, setMapCount] = useState('');
         const [wheelMaps, setWheelMaps] = useState([]);
         const [isSpinning, setIsSpinning] = useState(false);
         const [rotation, setRotation] = useState(0);
         const [winner, setWinner] = useState(null);
         const audioCtxRef = useRef(null);

         useEffect(() => { generateWheel(); }, []);

         const toggleStar = (star) => {
             if (selectedStars.includes(star)) setSelectedStars(selectedStars.filter(s => s !== star));
             else setSelectedStars([...selectedStars, star]);
         };

         const generateWheel = () => {
             if (isSpinning) return;
             let pool = [];
             MAP_POOL.forEach(group => { if (selectedStars.includes(group.stars)) pool = pool.concat(group.maps); });
             if (pool.length === 0) return showDialogAlert(wt.err);

             let shuffled = [...pool];
             for (let i = shuffled.length - 1; i > 0; i--) {
                 const j = Math.floor(Math.random() * (i + 1));
                 [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
             }

             let finalMaps = shuffled;
             const count = parseInt(mapCount);
             if (!isNaN(count) && count > 0 && count < shuffled.length) finalMaps = shuffled.slice(0, count);

             setWheelMaps(finalMaps); setRotation(0); setWinner(null);
         };

         const playTickSound = () => {
             try {
                 if (!audioCtxRef.current) {
                     const AudioContext = window.AudioContext || window.webkitAudioContext;
                     if (AudioContext) audioCtxRef.current = new AudioContext();
                 }
                 if (!audioCtxRef.current || audioCtxRef.current.state === 'suspended') audioCtxRef.current?.resume();
                 const ctx = audioCtxRef.current;
                 const osc = ctx.createOscillator();
                 const gain = ctx.createGain();
                 osc.connect(gain); gain.connect(ctx.destination);
                 osc.type = 'sine'; osc.frequency.setValueAtTime(1200, ctx.currentTime);
                 osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.05);
                 gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                 osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.05);
             } catch(e) {}
         };

         const spinWheel = () => {
             if (isSpinning || wheelMaps.length === 0) return;
             setIsSpinning(true); setWinner(null);
             const winIdx = Math.floor(Math.random() * wheelMaps.length);
             const angle = 360 / wheelMaps.length;
             const targetAngle = 360 - ((winIdx + 0.5) * angle);
             const extraSpins = 360 * (10 + Math.floor(Math.random() * 5));
             const currentMod = rotation % 360;
             let rotateBy = extraSpins + targetAngle - currentMod;
             if (rotateBy < extraSpins) rotateBy += 360;
             setRotation(r => r + rotateBy);

             const spinDuration = 10000; 
             const startTime = Date.now();
             
             const tickLoop = () => {
                 const elapsed = Date.now() - startTime;
                 if (elapsed >= spinDuration - 50) return; 
                 playTickSound();
                 let progress = elapsed / spinDuration;
                 let nextDelay = 20 + Math.pow(progress, 3) * 800; 
                 if (elapsed + nextDelay <= spinDuration) setTimeout(tickLoop, nextDelay);
             };
             tickLoop();
             setTimeout(() => { setIsSpinning(false); setWinner(wheelMaps[winIdx]); }, spinDuration);
         };

         return (
             <div className="fixed inset-0 z-[300] bg-black/90 flex flex-col items-center justify-center p-2 md:p-4 backdrop-blur-md animate-slide-up">
                 <div className="w-full max-w-6xl h-[95vh] md:h-[90vh] bg-slate-900 border border-cyan-500/50 rounded-2xl shadow-[0_0_50px_rgba(6,182,212,0.2)] flex flex-col overflow-hidden relative">
                     <div className="bg-slate-950 p-4 border-b border-slate-800 flex justify-between items-center shrink-0">

                                 <button onClick={spinWheel} disabled={isSpinning || wheelMaps.length === 0} className="flex-1 py-3 lg:py-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black rounded shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all uppercase tracking-widest text-sm md:text-lg disabled:opacity-50 lg:hover:scale-105 active:scale-95">{isSpinning ? wt.spinning : wt.spin}</button>

                         <div className="flex-1 p-4 md:p-8 bg-[#0f172a] relative flex items-center justify-center overflow-hidden">

                                 <div className="w-full h-full rounded-full border-4 md:border-8 border-slate-800 bg-slate-900 overflow-hidden relative shadow-[0_0_50px_rgba(0,0,0,0.8)] ease-[cubic-bezier(0.25,1,0.5,1)]" style={{ transform: `rotate(${rotation}deg)`, transitionProperty: 'transform', transitionDuration: isSpinning ? '10s' : '0s' }}>
                                     {wheelMaps.map((map, i) => {
                                         const angle = 360 / wheelMaps.length;
                                         return (
                                             <div key={`${map.id}-${i}`} className="absolute inset-0 origin-center" style={{ transform: `rotate(${i * angle}deg)`, maskImage: `conic-gradient(from 0deg at 50% 50%, black ${angle}deg, transparent ${angle}deg)`, WebkitMaskImage: `conic-gradient(from 0deg at 50% 50%, black ${angle}deg, transparent ${angle}deg)` }}>
                                                <div className="absolute inset-0 bg-cover bg-center" style={{ backgroundImage: `url(${MAP_BACKGROUNDS[map.id]})` }} />

                                                <div className="absolute inset-y-0 right-1/2 w-[1px] bg-white/30" style={{ transformOrigin: 'right' }} />
                                                <div className="absolute top-1/2 left-1/2 flex items-center justify-end px-3 md:px-8 font-black text-white drop-shadow-[0_2px_4px_rgba(0,0,0,1)] z-10" style={{ width: '50%', height: '40px', marginTop: '-20px', transformOrigin: 'left center', transform: `rotate(${angle / 2}deg)` }}>
                                                    <span className="truncate w-full text-right uppercase tracking-wider" style={{ fontSize: wheelMaps.length > 20 ? '8px' : wheelMaps.length > 10 ? '10px' : '14px' }}>{getMapName(map.id, lang)}</span>
                                                </div>
                                             </div>
                                         );
                                     })}
                                 </div>
                                 <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 md:w-20 md:h-20 bg-gradient-to-br from-slate-700 to-slate-900 border-4 border-slate-600 rounded-full shadow-[0_0_20px_rgba(0,0,0,0.8)] z-20 flex items-center justify-center">
                                      <div className="w-4 h-4 md:w-6 md:h-6 bg-slate-950 rounded-full shadow-inner"></div>
                                 </div>
                                 <div className="absolute -top-4 md:-top-6 left-1/2 -translate-x-1/2 z-30 drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)]">

                                             {wt.close}

    };

    const BroadcastOverlay = ({ broadcastState, setBroadcastState, viewSet, setViewSet, soloSetBO, soloMatchBO, players, personalRecords, games, totals, getGameCalculations, matchStatus1v1, lang, t, gameMode, tournamentName, team1Name, team2Name, onAssetSelect, onClose, carDatabase, petDatabase, playerPhotos }) => {
      const isTeamMode = gameMode === '2v2' || gameMode === '3v3';
      let broadcastRounds = [];
      let broadcastIndices = [];
      
      if (gameMode === '1v1' && matchStatus1v1) {
          games.forEach((g, i) => {
              if (matchStatus1v1.gameAssignments[i]?.set === viewSet) { broadcastRounds.push(g); broadcastIndices.push(i); }

          while (broadcastRounds.length < soloSetBO) { broadcastRounds.push(null); broadcastIndices.push(-1); }
      } else {
          broadcastRounds = [...games]; broadcastIndices = games.map((_, i) => i);
          while (broadcastRounds.length < Math.max(9, broadcastRounds.length)) { broadcastRounds.push(null); broadcastIndices.push(-1); }
      }

      const halfLen = Math.floor(players.length / 2);
      const activeGame = games[broadcastState.gameIndex] || games[0] || { times: [] };
      const mapName = activeGame.mapId ? getMapName(activeGame.mapId, lang) : 'UNKNOWN MAP';
      const mapStars = activeGame.mapId ? getMapStars(activeGame.mapId) : 0;
      const bgStyle = getMapBackgroundStyle(activeGame.mapId);
      const modeText = gameMode === 'solo' ? t.preMatchModeSolo : gameMode === '1v1' ? t.mode1v1 : gameMode === '2v2' ? t.preMatchMode2v2 : t.preMatchMode3v3;
      let headerTitle = gameMode === 'solo' ? t.preMatchTitleIndiv : gameMode === '1v1' ? t.preMatchTitle1v1 : t.preMatchTitleTeam;
      let setRoundText = "";
      if (gameMode === '1v1' && matchStatus1v1) {
          const assign = matchStatus1v1.gameAssignments[broadcastState.gameIndex];
          if (assign) setRoundText = `SET ${assign.set} - GAME ${assign.round}`;
      }

      const [assetSearch, setAssetSearch] = useState('');

      return (
        <div className="fixed inset-0 w-screen h-screen bg-[#050510] flex flex-col font-sans overflow-hidden animate-slide-up z-[9999]">

              <div className="flex items-center gap-2 md:gap-4">

                <button onClick={() => setBroadcastState({ ...broadcastState, tab: 'prematch' })} className={`px-4 md:px-8 py-2 md:py-2.5 font-black italic tracking-widest clip-slant transition-colors text-[10px] md:text-sm uppercase ${broadcastState.tab === 'prematch' ? 'bg-[#13c0eb] text-[#050510]' : 'bg-[#1e293b] text-slate-400 hover:bg-slate-700 hover:text-white'}`}>{t.prematchTab}</button>
              </div>

                  <div className="flex items-center gap-3 mt-1.5 bg-slate-900 border border-slate-700 rounded-full px-3 py-0.5 shadow-inner">
                      <button onClick={() => setViewSet(v => Math.max(1, v - 1))} className="text-slate-400 hover:text-cyan-400 px-2 font-bold text-lg">&lt;</button>
                      <span className="text-cyan-400 font-black text-xs uppercase tracking-widest min-w-[50px] text-center">SET {viewSet}</span>
                      <button onClick={() => setViewSet(v => Math.min(soloMatchBO, v + 1))} className="text-slate-400 hover:text-cyan-400 px-2 font-bold text-lg">&gt;</button>
                  </div>

              <div className="w-full flex-1 min-h-0 bg-[#1e293b]/60 backdrop-blur-md rounded-xl overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.5)] flex flex-col border border-slate-700/50">
                
                <div className="flex-1 flex overflow-x-auto overflow-y-hidden hide-scrollbar snap-x snap-mandatory scroll-smooth w-full">

                      const gIndex = broadcastIndices[idx];
                      const isPlayed = game && game.times && game.times.some(t => t !== '');
                      const calcs = isPlayed ? getGameCalculations(gIndex, game.times) : [];
                      const mapName = game && game.mapId ? getMapName(game.mapId, lang) : '';
                      const style = game && game.mapId ? getMapBackgroundStyle(game.mapId) : {};

                                              </div>
                                              {time ? (
                                                 <div className="flex flex-col items-center justify-center mt-0.5 z-10 w-full px-1">
                                                    <div className="flex items-center justify-center gap-1 w-full">

                                                          {gameMode === '1v1' ? (isTop ? (lang === 'vi' ? 'THẮNG' : 'WIN') : (lang === 'vi' ? 'THUA' : 'LOSE')) : `+${c.score}`}

                                                        {c.isKingMap && isTop && (<Crown size={crownSize} className="text-[#fce300] animate-bounce drop-shadow-[0_0_8px_rgba(252,227,0,1)]"/>)}
                                                    </div>
                                                    {(gameMode === 'solo' || gameMode === '1v1') && (<span className={`${timeSize} font-mono font-black truncate w-full text-center ${isTop ? 'text-cyan-200' : 'text-slate-300'} mt-1 opacity-100 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] leading-none tracking-wider`}>{time}</span>)}
                                                 </div>
                                              ) : (
                                                 <div className="flex flex-col items-center justify-center mt-0.5 z-10 w-full px-1">
                                                    <span className={`${scoreSize} font-black leading-none truncate w-full text-center text-slate-400 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]`}>-</span>

                                   <div className="relative z-10 h-8 md:h-10 shrink-0 bg-gradient-to-t from-[#0f172a] via-[#0f172a]/80 to-transparent flex items-end justify-center pb-1 px-1 border-t border-white/10">

                <div className="flex bg-[#0f172a]/80 backdrop-blur-xl border-t border-slate-700/50 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] h-16 md:h-20 w-full shrink-0 relative z-20">
                  {gameMode === '1v1' && matchStatus1v1 ? (
                    <div className="flex w-full h-full bg-[#0ea5e9] items-center justify-between px-2 md:px-8 text-white font-black shadow-[inset_0_5px_20px_rgba(2,132,199,0.8)]">
                        <div className="flex items-center justify-start gap-4 flex-1 h-full pl-4 md:pl-8">

                        <div className="flex-shrink-0 px-8 md:px-16 h-full bg-gradient-to-b from-white/90 to-white/70 skew-x-[-15deg] mx-4 flex items-center justify-center border-x border-white/50 shadow-2xl z-10">
                            <span className="block skew-x-[15deg] text-2xl md:text-3xl text-[#0ea5e9] font-black italic drop-shadow-sm">VS</span>

                            <div className="w-px h-8 bg-white/40 shadow-[1px_0_0_rgba(0,0,0,0.2)]"></div>

                            <div className="w-px h-8 bg-white/40 shadow-[1px_0_0_rgba(0,0,0,0.2)]"></div>
                            <span className="text-3xl md:text-4xl text-[#fce300] font-black drop-shadow-[0_0_10px_rgba(252,227,0,0.6)]">{matchStatus1v1.p2Sets}</span>
                        </div>
                    </div>
                  ) : isTeamMode ? (
                     <div className="flex w-full h-full relative">
                       <div className="flex-1 flex flex-col items-center justify-center bg-gradient-to-r from-blue-900/50 to-blue-800/30 backdrop-blur-md relative overflow-hidden">
                          <div className="absolute right-0 top-0 bottom-0 w-1 bg-blue-500 shadow-[0_0_15px_#3b82f6]"></div>
                          <span className="text-blue-200 font-black text-sm md:text-base uppercase tracking-widest drop-shadow-md z-10">{team1Name}</span>
                          <span className="text-white font-black text-3xl md:text-5xl mt-0.5 drop-shadow-[0_0_15px_rgba(59,130,246,0.5)] leading-none z-10">
                             {totals.filter((_, i) => i < halfLen).reduce((a, b) => a + b, 0)}
                          </span>
                       </div>
                       <div className="flex-1 flex flex-col items-center justify-center bg-gradient-to-l from-red-900/50 to-red-800/30 backdrop-blur-md relative overflow-hidden">
                          <div className="absolute left-0 top-0 bottom-0 w-1 bg-red-500 shadow-[0_0_15px_#ef4444]"></div>
                          <span className="text-red-200 font-black text-sm md:text-base uppercase tracking-widest drop-shadow-md z-10">{team2Name}</span>
                          <span className="text-white font-black text-3xl md:text-5xl mt-0.5 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)] leading-none z-10">
                             {totals.filter((_, i) => i >= halfLen).reduce((a, b) => a + b, 0)}
                          </span>
                       </div>
                     </div>
                  ) : (
                     players.map((p, i) => (
                      <div key={`foot_p_${i}`} className="flex-1 flex flex-col items-center justify-center border-r border-slate-700/50 bg-slate-900/40 backdrop-blur-md last:border-r-0 overflow-hidden px-2 relative group hover:bg-slate-800/80 transition-colors">
                        <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-500 to-blue-500 opacity-50 group-hover:opacity-100 transition-opacity"></div>
                        <span className="text-cyan-200 font-bold text-sm md:text-base truncate max-w-full tracking-wide drop-shadow-md z-10">{p}</span>
                        <span className="text-white font-black text-3xl md:text-5xl mt-0.5 drop-shadow-[0_0_15px_rgba(255,255,255,0.3)] leading-none z-10">{totals[i]}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {broadcastState.tab === 'prematch' && (
            <div className="flex-1 w-full max-w-[1920px] mx-auto p-4 md:p-8 flex flex-col z-10 relative animate-slide-up">
              <div className="w-full flex justify-between items-end mb-4 md:mb-6">
                <h2 className="text-2xl md:text-4xl font-black italic text-[#13c0eb] tracking-widest drop-shadow-[0_0_10px_rgba(19,192,235,0.5)] whitespace-normal break-words max-w-[70%] leading-tight">{headerTitle}</h2>
                <select value={broadcastState.gameIndex} onChange={e => setBroadcastState({...broadcastState, gameIndex: Number(e.target.value)})} className="bg-[#0f172a]/80 backdrop-blur-md text-cyan-300 font-bold px-4 py-2 rounded-lg outline-none border border-cyan-500/50 shadow-[0_0_15px_rgba(6,182,212,0.3)] cursor-pointer text-sm">
                   {games.map((g, i) => {
                      let titleStr = `ROUND ${i+1}`;
                      if (gameMode === '1v1' && matchStatus1v1?.gameAssignments[i]) titleStr = `SET ${matchStatus1v1.gameAssignments[i].set} - G${matchStatus1v1.gameAssignments[i].round}`;
                      return <option key={g.id} value={i} className="bg-slate-900">{titleStr} - {g.mapId ? getMapName(g.mapId, lang) : 'UNKNOWN MAP'}</option>
                   })}
                </select>
              </div>

              <div className="flex-1 flex flex-col md:flex-row gap-6 min-h-0">
                 <div className="w-full md:w-[40%] flex flex-col rounded-2xl overflow-hidden shadow-[0_15px_40px_rgba(0,0,0,0.5)] border border-cyan-500/40 bg-[#0f172a]/80 backdrop-blur-xl">
                    <div className="p-5 md:p-6 border-b border-white/10 flex justify-between items-center bg-gradient-to-r from-[#0ea5e9]/20 to-transparent shrink-0">
                        <div className="flex flex-col max-w-[70%]">
                            <span className="font-black italic text-lg md:text-xl lg:text-2xl xl:text-3xl text-cyan-300 uppercase tracking-wider drop-shadow-md break-words leading-tight">{gameMode === '1v1' ? `${setRoundText} | ${mapName}` : mapName}</span>
                            <div className="flex text-yellow-400 text-sm md:text-base mt-1 drop-shadow-[0_0_5px_rgba(250,204,21,0.8)]">{Array(mapStars).fill(0).map((_, i) => <span key={i}>★</span>)}</div>
                        </div>
                        <div className="flex flex-col items-end">
                            <span className="text-[10px] md:text-xs font-bold opacity-80 uppercase tracking-widest text-cyan-500">{t.preMatchMode}</span>
                            <span className="font-black italic text-lg md:text-xl text-white">{modeText}</span>
                        </div>
                    </div>
                    <div className="flex-1 relative p-4 md:p-5">
                        <div className="w-full h-full rounded-xl overflow-hidden border border-white/10 shadow-inner relative" style={bgStyle}>
                           <div className="absolute inset-0 border-2 border-cyan-500/20 mix-blend-overlay pointer-events-none"></div>
                           <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-50"></div>
                        </div>
                    </div>
                 </div>
                 
                 <div className={`w-full md:w-[60%] grid gap-4 lg:gap-6 ${players.length > 4 ? 'grid-cols-3' : 'grid-cols-2'} h-full max-h-full`}>
                    {players.map((playerName, pIdx) => {
                       const isTeam2 = isTeamMode && pIdx >= Math.floor(players.length / 2);
                       const cardGradient = isTeam2 ? 'from-red-900/60 to-red-800/40 border-red-500/40' : 'from-blue-900/60 to-blue-800/40 border-blue-500/40';
                       const textAccent = isTeam2 ? 'text-red-300' : 'text-cyan-300';
                       const pbKey = `${playerName}_${activeGame.mapId}`;
                       const pbData = personalRecords[pbKey];
                       const displayRecord = pbData ? pbData.timeStr : '--:--.--';
                       const photoUrl = playerPhotos[pIdx] || '';
                       const carId = activeGame.cars?.[pIdx] || '';
                       const petId = activeGame.pets?.[pIdx] || '';
                       const carObj = carDatabase.find(c => c.id === carId);
                       const petObj = petDatabase.find(p => p.id === petId);

                       return (
                         <div key={pIdx} className={`relative flex flex-col rounded-2xl overflow-hidden shadow-2xl border backdrop-blur-md bg-gradient-to-br ${cardGradient} transition-transform hover:-translate-y-1 duration-300`}>
                            <div className="absolute inset-0 bg-gradient-to-tr from-white/5 to-transparent opacity-50"></div>
                            
                            <div className="absolute bottom-0 left-0 w-[60%] h-[95%] flex items-end justify-center pointer-events-none z-10">
                               {photoUrl ? (<img src={photoUrl} className="max-w-full max-h-full object-contain object-bottom drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)]" alt={playerName} onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/200x300/transparent/white?text=?'; }} />) : (<div className="flex items-center justify-center opacity-20 mb-8"><User size={100} /></div>)}
                            </div>

                            <div className="absolute top-5 right-5 z-20 flex flex-col items-end text-right max-w-full pl-[40%]">
                               <span className="text-lg md:text-xl lg:text-2xl font-black italic text-white drop-shadow-md truncate w-full">{playerName}</span>
                               <span className={`text-[8px] md:text-[10px] font-bold tracking-widest uppercase mt-1 opacity-90 ${textAccent}`}>{t.preMatchBestRecord}</span>
                               <div className="text-3xl md:text-4xl lg:text-5xl font-black font-['Chakra_Petch'] text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.6)] mt-[-4px]">{displayRecord}</div>
                            </div>

                            <div className="relative z-30 p-3 md:p-4 flex flex-col items-end justify-end mt-auto bg-gradient-to-t from-black/80 to-transparent pt-12">
                               <div className="flex gap-2 items-center">
                                  <div className="flex flex-col items-end cursor-pointer group" onClick={() => setAssetModal({ type: 'car', pIndex: pIdx })}>
                                     <div className="w-20 h-10 md:w-28 md:h-14 flex items-center justify-center relative transition-transform group-hover:scale-110">
                                        {carObj ? <img src={carObj.img} className="max-w-full max-h-full object-contain drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)] scale-150" alt="Car" onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/100x50/333/white?text=CAR'; }} /> : <div className="px-2 py-1 rounded bg-black/30 text-[8px] md:text-[10px] text-white/50 font-bold italic">{t.selectCar}</div>}
                                     </div>
                                     <span className={`text-[6px] md:text-[8px] uppercase mt-1 opacity-70 font-bold ${textAccent}`}>{carObj ? carObj.name : ''}</span>
                                  </div>
                                  <div className="flex flex-col items-end cursor-pointer group" onClick={() => setAssetModal({ type: 'pet', pIndex: pIdx })}>
                                     <div className="w-20 h-10 md:w-28 md:h-14 flex items-center justify-center relative transition-transform group-hover:scale-110">
                                        {petObj ? <img src={petObj.img} className="max-w-full max-h-full object-contain drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)] scale-150" alt="Pet" onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/100x50/333/white?text=PET'; }} /> : <div className="px-2 py-1 rounded bg-black/30 text-[8px] md:text-[10px] text-white/50 font-bold italic">{t.selectPet}</div>}
                                     </div>
                                     <span className={`text-[6px] md:text-[8px] uppercase mt-1 opacity-70 font-bold text-right max-w-[80px] leading-tight truncate ${textAccent}`}>{petObj ? petObj.name : ''}</span>
                                  </div>
                               </div>
                            </div>
                         </div>
                       );
                    })}
                 </div>
              </div>
            </div>
          )}

          {assetModal && (
            <div className="absolute inset-0 z-[2000] bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm animate-slide-up">
                <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-2xl w-full shadow-[0_0_50px_rgba(0,0,0,0.5)] flex flex-col h-[70vh] overflow-hidden">
                    <div className="flex justify-between items-center p-4 bg-slate-950 border-b border-slate-800">
                        <h3 className="text-white font-black italic tracking-widest uppercase">{assetModal.type === 'car' ? t.selectCar : t.selectPet} - PLAYER {assetModal.pIndex + 1}</h3>
                        <button onClick={() => {setAssetModal(null); setAssetSearch('');}} className="text-slate-400 hover:text-red-500"><XIcon size={24}/></button>
                    </div>
                    <div className="p-3 bg-slate-950 border-b border-slate-800">
                        <input type="text" autoFocus placeholder="Tìm kiếm / Search..." value={assetSearch} onChange={e => setAssetSearch(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-white outline-none focus:border-cyan-500 transition-colors" />
                    </div>
                    <div className="flex-1 overflow-y-auto hide-scrollbar p-4 grid grid-cols-2 sm:grid-cols-3 gap-4 bg-[#0f172a]">
                        <div onClick={() => { onAssetSelect(broadcastState.gameIndex, assetModal.pIndex, assetModal.type, ''); setAssetModal(null); setAssetSearch(''); }} className="bg-slate-800/50 border border-slate-700 border-dashed rounded-lg p-2 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-800 hover:border-red-500 transition-colors text-slate-500 hover:text-red-500">
                            <Trash2 size={24} className="mb-2" />
                            <span className="text-[10px] font-bold">Xóa / Clear</span>
                        </div>
                        {(assetModal.type === 'car' ? carDatabase : petDatabase).filter(item => item.name.toLowerCase().includes(assetSearch.toLowerCase())).map(item => (
                                <div key={item.id} onClick={() => { onAssetSelect(broadcastState.gameIndex, assetModal.pIndex, assetModal.type, item.id); setAssetModal(null); setAssetSearch(''); }} className="bg-slate-800/80 border border-slate-700 rounded-lg p-3 flex flex-col items-center justify-between gap-3 cursor-pointer hover:bg-slate-700 hover:border-cyan-400 transition-all shadow-md group">
                                    <div className="w-full h-16 bg-black/40 rounded flex items-center justify-center p-1 shadow-inner overflow-hidden">
                                        <img src={item.img} className="max-w-full max-h-full object-contain group-hover:scale-110 transition-transform" onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/100x50/333/white?text=?'; }} />
                                    </div>
                                    <span className="text-[10px] text-white font-bold text-center w-full truncate px-1">{item.name}</span>
                                </div>
                            ))
                        }
                    </div>
                </div>
            </div>
          )}
        </div>
      );
    };

    function App() {
      const isBroadcastTab = window.location.search.includes('broadcast=true');
      
      const [lang, setLang] = useState(() => localStorage.getItem('zsm_lang_v11_final') || 'vi');
      const t = TRANSLATIONS[lang];
      const [showInfo, setShowInfo] = useState(false);
      const [showDbModal, setShowDbModal] = useState(false);
      const [showGroupModal, setShowGroupModal] = useState(false);
      const [showSaveGroupModal, setShowSaveGroupModal] = useState(false);
      
      const [showAssetManager, setShowAssetManager] = useState(null); 

      const [broadcastState, setBroadcastState] = useState({ isOpen: isBroadcastTab, tab: 'scoreboard', gameIndex: 0 });
      const [dialog, setDialog] = useState({ isOpen: false, type: 'alert', message: '', onConfirm: null });

      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [activeSidebarMenu, setActiveSidebarMenu] = useState(null);

      const showDialogAlert = (msg) => setDialog({ isOpen: true, type: 'alert', message: msg, onConfirm: null });
      const showDialogConfirm = (msg, onConfirmCallback) => setDialog({ isOpen: true, type: 'confirm', message: msg, onConfirm: onConfirmCallback });

      const [carDatabase, setCarDatabase] = useState(() => {
          const saved = localStorage.getItem('zsm_cars_db_v1');
          if (saved) { try { return JSON.parse(saved); } catch(e) {} }
          return [
              { id: 'c1', name: 'Dark Azure Dragon', img: 'https://i.ibb.co/3s6Vp6Z/car1.png' },
              { id: 'c2', name: 'Hallet', img: 'https://i.ibb.co/3s6Vp6Z/car1.png' },
              { id: 'c3', name: 'S-Chrono Envoy', img: 'https://i.ibb.co/3s6Vp6Z/car1.png' },
              { id: 'c4', name: 'L-Qing', img: 'https://i.ibb.co/3s6Vp6Z/car1.png' }
          ];
      });

      const [petDatabase, setPetDatabase] = useState(() => {
          const saved = localStorage.getItem('zsm_pets_db_v1');
          if (saved) { try { return JSON.parse(saved); } catch(e) {} }
          return [{ id: 'p1', name: 'Hellfire Dragon', img: 'https://i.ibb.co/3s6Vp6Z/car1.png' }, { id: 'p2', name: 'Angel Feather', img: 'https://i.ibb.co/3s6Vp6Z/car1.png' }];
      });

      const [playerPhotos, setPlayerPhotos] = useState(() => {
          const saved = localStorage.getItem('zsm_player_photos_v1');
          if (saved) { try { return JSON.parse(saved); } catch(e) {} }
          return Array(6).fill(""); 
      });

      const [bannedMaps, setBannedMaps] = useState(() => {
          const saved = localStorage.getItem('zsm_banned_maps_1v1_v11');
          if (saved) { try { return JSON.parse(saved); } catch(e) {} }
          return {}; 
      });

      const [savedGroups, setSavedGroups] = useState(() => {
          const saved = localStorage.getItem('zsm_saved_groups_v1');
          if (saved) { try { return JSON.parse(saved); } catch(e) {} }
          return [];
      });

      const [tournamentName, setTournamentName] = useState(() => localStorage.getItem('zsm_tour_name') || 'CUSTOM TOURNAMENT');
      const [team1Name, setTeam1Name] = useState(() => localStorage.getItem('zsm_team1_name') || '');
      const [team2Name, setTeam2Name] = useState(() => localStorage.getItem('zsm_team2_name') || '');

      const [gameMode, setGameMode] = useState(() => localStorage.getItem('zsm_game_mode_v11') || 'solo');
      const isTeamMode = gameMode === '2v2' || gameMode === '3v3';

      const [soloMatchBO, setSoloMatchBO] = useState(() => Number(localStorage.getItem('zsm_solo_match_bo')) || 3);
      const [soloSetBO, setSoloSetBO] = useState(() => Number(localStorage.getItem('zsm_solo_set_bo')) || 7);

      const [players, setPlayers] = useState(() => {
        const saved = localStorage.getItem('zsm_players_v11_final');
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        return [`${t.defPlayer} 1`, `${t.defPlayer} 2`, `${t.defPlayer} 3`, `${t.defPlayer} 4`];
      });

      const [games, setGames] = useState(() => {
        const saved = localStorage.getItem('zsm_games_v11_final');
        if (saved) { 
           try { 
             const parsed = JSON.parse(saved);
             return parsed.map(g => ({ ...g, cars: g.cars || Array(6).fill(''), pets: g.pets || Array(6).fill('') }));
           } catch(e) {} 
        }
        return Array(9).fill(null).map((_, i) => ({ id: Date.now() + i, mapId: "", times: Array(6).fill(''), cars: Array(6).fill(''), pets: Array(6).fill('') }));
      });

      const [personalRecords, setPersonalRecords] = useState(() => {
        const saved = localStorage.getItem('zsm_personal_records_v11_final');
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        return {}; 
      });

      const [viewSet, setViewSet] = useState(1);

      useEffect(() => {
          const handleStorageChange = (e) => {
              if(!e.newValue) return;
              try {
                  if (e.key === 'zsm_games_v11_final') setGames(JSON.parse(e.newValue));
                  else if (e.key === 'zsm_players_v11_final') setPlayers(JSON.parse(e.newValue));
                  else if (e.key === 'zsm_tour_name') setTournamentName(e.newValue);
                  else if (e.key === 'zsm_team1_name') setTeam1Name(e.newValue);
                  else if (e.key === 'zsm_team2_name') setTeam2Name(e.newValue);
                  else if (e.key === 'zsm_game_mode_v11') setGameMode(e.newValue);
                  else if (e.key === 'zsm_solo_match_bo') setSoloMatchBO(Number(e.newValue));
                  else if (e.key === 'zsm_solo_set_bo') setSoloSetBO(Number(e.newValue));
                  else if (e.key === 'zsm_banned_maps_1v1_v11') setBannedMaps(JSON.parse(e.newValue));
                  else if (e.key === 'zsm_player_photos_v1') setPlayerPhotos(JSON.parse(e.newValue));
                  else if (e.key === 'zsm_cars_db_v1') setCarDatabase(JSON.parse(e.newValue));
                  else if (e.key === 'zsm_pets_db_v1') setPetDatabase(JSON.parse(e.newValue));
                  else if (e.key === 'zsm_personal_records_v11_final') setPersonalRecords(JSON.parse(e.newValue));
              } catch(err) { console.error("Sync Error", err); }
          };
          window.addEventListener('storage', handleStorageChange);
          return () => window.removeEventListener('storage', handleStorageChange);
      }, []);

      useEffect(() => {
        const allDefP = Object.values(TRANSLATIONS).map(tr => tr.defPlayer);
        const currentT = TRANSLATIONS[lang];
        setPlayers(prev => prev.map(p => {
          for (let def of allDefP) {
            if (p.startsWith(def + ' ')) {
              const num = p.replace(def + ' ', '');
              if (!isNaN(num)) return `${currentT.defPlayer} ${num}`;
            }
          }
          return p;
        }));
      }, [lang]);

      useEffect(() => { localStorage.setItem('zsm_lang_v11_final', lang); }, [lang]);
      useEffect(() => { localStorage.setItem('zsm_tour_name', tournamentName); }, [tournamentName]);
      useEffect(() => { localStorage.setItem('zsm_team1_name', team1Name); }, [team1Name]);
      useEffect(() => { localStorage.setItem('zsm_team2_name', team2Name); }, [team2Name]);
      useEffect(() => { localStorage.setItem('zsm_game_mode_v11', gameMode); }, [gameMode]);
      useEffect(() => { localStorage.setItem('zsm_solo_match_bo', soloMatchBO); }, [soloMatchBO]);
      useEffect(() => { localStorage.setItem('zsm_solo_set_bo', soloSetBO); }, [soloSetBO]);
      useEffect(() => { localStorage.setItem('zsm_players_v11_final', JSON.stringify(players)); }, [players]);
      useEffect(() => { localStorage.setItem('zsm_games_v11_final', JSON.stringify(games)); }, [games]);
      useEffect(() => { localStorage.setItem('zsm_personal_records_v11_final', JSON.stringify(personalRecords)); }, [personalRecords]);
      useEffect(() => { localStorage.setItem('zsm_cars_db_v1', JSON.stringify(carDatabase)); }, [carDatabase]);
      useEffect(() => { localStorage.setItem('zsm_pets_db_v1', JSON.stringify(petDatabase)); }, [petDatabase]);
      useEffect(() => { localStorage.setItem('zsm_player_photos_v1', JSON.stringify(playerPhotos)); }, [playerPhotos]);
      useEffect(() => { localStorage.setItem('zsm_banned_maps_1v1_v11', JSON.stringify(bannedMaps)); }, [bannedMaps]);
      useEffect(() => { localStorage.setItem('zsm_saved_groups_v1', JSON.stringify(savedGroups)); }, [savedGroups]);

      // FIX LỖI TỰ ĐỘNG CẮT GAME: Chỉ ép độ dài mảng khi ở chế độ 1v1
      useEffect(() => {
          if (gameMode === '1v1') {
              const targetLen = soloMatchBO * soloSetBO;
              setGames(prev => {
                  if (prev.length === targetLen) return prev;
                  let newGames = [...prev];
                  if (newGames.length < targetLen) {
                      while(newGames.length < targetLen) newGames.push({ id: Date.now() + Math.random(), mapId: "", times: Array(6).fill(''), cars: Array(6).fill(''), pets: Array(6).fill('') });
                  } else {
                      newGames = newGames.slice(0, targetLen);
                  }
                  return newGames;
              });
          }
      }, [gameMode, soloMatchBO, soloSetBO]);

      const displayTeam1Name = team1Name.trim() || t.team1;
      const displayTeam2Name = team2Name.trim() || t.team2;

      const handleTimeChange = (gIndex, pIndex, val) => {
        const newGames = [...games]; newGames[gIndex].times[pIndex] = val; setGames(newGames);
      };

      const handleAssetSelect = (gIndex, pIndex, type, assetId) => {
        const newGames = [...games];
        if (!newGames[gIndex].cars) newGames[gIndex].cars = Array(6).fill('');
        if (!newGames[gIndex].pets) newGames[gIndex].pets = Array(6).fill('');
        if (type === 'car') newGames[gIndex].cars[pIndex] = assetId;
        if (type === 'pet') newGames[gIndex].pets[pIndex] = assetId;
        setGames(newGames);
      };

      const handleBanChange = (setNum, pIndex, banSlot, mapId) => {
        setBannedMaps(prev => {
            const newState = { ...prev };
            if (!newState[setNum]) newState[setNum] = { 0: ['', ''], 1: ['', ''] };
            newState[setNum][pIndex][banSlot] = mapId;
            return newState;
        });
      };

      const getBannedMapsForSet = (setNum) => {
          if (!bannedMaps[setNum]) return [];
          return [...(bannedMaps[setNum][0] || []), ...(bannedMaps[setNum][1] || [])].filter(id => id);
      };

      const currentSetBans = useMemo(() => getBannedMapsForSet(viewSet), [bannedMaps, viewSet]);

      const handleTimeBlur = (gIndex, pIndex) => {
        const newGames = [...games]; 
        const rawTime = newGames[gIndex].times[pIndex];
        const formattedTime = formatTimeDisplay(rawTime);
        newGames[gIndex].times[pIndex] = formattedTime; 
        setGames(newGames);

        const mapId = newGames[gIndex].mapId;
        const timeMs = parseTime(formattedTime);
        
        if (mapId && timeMs !== null && rawTime.toUpperCase() !== 'X') {
           const playerName = players[pIndex];
           const pbKey = `${playerName}_${mapId}`;

           setPersonalRecords(prev => {
              const currentPB = prev[pbKey];
              if (!currentPB || timeMs < currentPB.timeMs) return { ...prev, [pbKey]: { timeMs: timeMs, timeStr: formattedTime } };
              return prev;
           });
        }
      };

      const toggleMode = () => {
          let nextMode = 'solo';
          if (gameMode === 'solo') nextMode = '2v2';
          else if (gameMode === '2v2') nextMode = '3v3';
          else if (gameMode === '3v3') nextMode = '1v1';
          setGameMode(nextMode);

          if (nextMode === 'solo' || nextMode === '2v2') {
             let newP = [...players];
             if (newP.length < 4) while(newP.length < 4) newP.push(`${t.defPlayer} ${newP.length + 1}`);
             else if (newP.length > 4) newP = newP.slice(0, 4); 
             setPlayers(newP);
          } else if (nextMode === '3v3') {
             let newP = [...players];
             while(newP.length < 6) newP.push(`${t.defPlayer} ${newP.length + 1}`);
             setPlayers(newP);
          } else if (nextMode === '1v1') {
             let newP = [...players];
             if (newP.length > 2) newP = newP.slice(0, 2);

      const addGame = () => {

      const removeGame = (gIndex) => {

        showDialogConfirm(t.delG.replace('{0}', gIndex + 1), () => { setGames(games.filter((_, i) => i !== gIndex)); });

      const clearAll = () => {
        showDialogConfirm(t.confirmReset, () => {
          resetGroupState();
        });

      const handleSaveCurrentGroup = (name) => {
          if (!name.trim()) return showDialogAlert(t.groupNamePh);
          const newGroup = {
              id: `group_${Date.now()}`,
              name: name,
              date: new Date().toLocaleDateString(),

          setSavedGroups([newGroup, ...savedGroups]);
          showDialogAlert(t.groupSaved);

      const resetGroupState = () => {
          setPlayers(gameMode === '1v1' ? [`${t.defPlayer} 1`, `${t.defPlayer} 2`] : [`${t.defPlayer} 1`, `${t.defPlayer} 2`, `${t.defPlayer} 3`, `${t.defPlayer} 4`]);
          const numGames = gameMode === '1v1' ? (soloMatchBO * soloSetBO) : 9;

      const loadGroupState = (data) => {
          if(data.players) setPlayers(data.players);

      const matchStatus1v1 = useMemo(() => {
        if (gameMode !== '1v1') return null;
        let p1Sets = 0, p2Sets = 0, p1Rounds = 0, p2Rounds = 0, currentSet = 1, gameAssignments = [], mapsUsedSet12 = [], mapsUsedSet3 = [];
        const winCond = Math.ceil(soloSetBO / 2);
        
        games.forEach((g, idx) => {
            const setNum = Math.floor(idx / soloSetBO) + 1;
            const roundNum = (idx % soloSetBO) + 1;
            gameAssignments.push({ set: setNum, round: roundNum });
            if (g.mapId) { if (setNum < 3) mapsUsedSet12.push(g.mapId); else mapsUsedSet3.push(g.mapId); }
        });

        for (let s = 1; s <= soloMatchBO; s++) {
            let s_p1Rounds = 0, s_p2Rounds = 0, setFinished = false;
            for (let r = 1; r <= soloSetBO; r++) {
                const gIdx = (s - 1) * soloSetBO + (r - 1);
                if (gIdx >= games.length) continue;
                const g = games[gIdx];
                const t1 = g.times[0]; const t2 = g.times[1];

                if (isT1Final && isT2Final) {
                    const v1 = parseTime(t1); const v2 = parseTime(t2);
                    const p1DNF = t1.toUpperCase() === 'X', p2DNF = t2.toUpperCase() === 'X';
                    if (v1 !== null && v2 !== null) winner = v1 < v2 ? 0 : (v2 < v1 ? 1 : -1);
                    else if (v1 !== null || p2DNF) winner = 0;
                    else if (v2 !== null || p1DNF) winner = 1;
                }
                
                if (winner === 0) s_p1Rounds++;
                if (winner === 1) s_p2Rounds++;
                if (s_p1Rounds >= winCond) { p1Sets++; setFinished = true; break; }
                if (s_p2Rounds >= winCond) { p2Sets++; setFinished = true; break; }
            }
            if (!setFinished) { currentSet = s; p1Rounds = s_p1Rounds; p2Rounds = s_p2Rounds; break;  }
        }
        return { p1Sets, p2Sets, p1Rounds, p2Rounds, currentSet, gameAssignments, mapsUsedSet12, mapsUsedSet3 };
      }, [games, gameMode, soloMatchBO, soloSetBO]);

      useEffect(() => { if (gameMode === '1v1' && matchStatus1v1?.currentSet) setViewSet(matchStatus1v1.currentSet); }, [matchStatus1v1?.currentSet, gameMode]);

      const selectedMaps = useMemo(() => {
        if (gameMode === '1v1' && matchStatus1v1) return [];

      const exportProfessionalExcel = async () => {

        titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
        titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
        sheet.getRow(1).height = 40;

        sheet.getCell(2, 1).value = t.match;
        sheet.getCell(2, 1).font = { bold: true };
        
        players.forEach((p, i) => {
          const timeCol = 2 + (i * 2); const ptsCol = 3 + (i * 2);
          sheet.mergeCells(2, timeCol, 2, ptsCol);
          const pCell = sheet.getCell(2, timeCol);
          pCell.value = p;
          
          let headerColor = 'FFDDEBF7'; 
          if (isTeamMode) headerColor = (i < halfLen) ? 'FFBFDBFE' : 'FFFECACA'; 
          pCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: headerColor } }; 
          pCell.font = { bold: true }; pCell.alignment = { horizontal: 'center' };

          sheet.getCell(3, timeCol).value = "Time";
          sheet.getCell(3, ptsCol).value = t.pts;
          sheet.getCell(3, ptsCol).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE2EFDA' } }; 
        });

        sheet.getRow(2).alignment = { horizontal: 'center', vertical: 'middle' };
        sheet.getRow(3).alignment = { horizontal: 'center', vertical: 'middle' };
        sheet.getRow(2).height = 25;

        games.forEach((game, gIndex) => {
          const rowNum = 4 + gIndex;
          const mapName = game.mapId ? getMapName(game.mapId, lang) : '';
          
          let matchStr = `${t.defGame} ${gIndex + 1}`;
          if (gameMode === '1v1' && matchStatus1v1 && matchStatus1v1.gameAssignments[gIndex]) {
              matchStr = `S${matchStatus1v1.gameAssignments[gIndex].set} - G${matchStatus1v1.gameAssignments[gIndex].round}`;
          }
          sheet.getCell(rowNum, 1).value = `${matchStr}${mapName ? ` - ${mapName}` : ''}`;
          
          const calcs = getGameCalculations(gIndex, game.times);
          game.times.forEach((time, pIdx) => {
            if (pIdx >= players.length) return;
            const timeCol = 2 + (pIdx * 2); const ptsCol = 3 + (pIdx * 2);
            const score = calcs[pIdx].score;
            sheet.getCell(rowNum, timeCol).value = time || "-";
            sheet.getCell(rowNum, ptsCol).value = time ? score : 0;
            sheet.getCell(rowNum, timeCol).alignment = { horizontal: 'center' };
            sheet.getCell(rowNum, ptsCol).alignment = { horizontal: 'center' };

            if (calcs[pIdx].isBest) {
              const bgColor = calcs[pIdx].isKingMap ? 'FFFF6666' : 'FFFFFF99'; 
              const fontColor = calcs[pIdx].isKingMap ? 'FF9C0006' : 'FF000000'; 
              sheet.getCell(rowNum, timeCol).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgColor } };
              sheet.getCell(rowNum, ptsCol).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgColor } };
              sheet.getCell(rowNum, ptsCol).font = { bold: true, color: { argb: fontColor } };
            }
          });
        });

        const totalRow = 4 + games.length;
        const totalLabelCell = sheet.getCell(totalRow, 1);
        totalLabelCell.value = isTeamMode ? t.indivTotal : (gameMode === '1v1' ? t.roundScore : t.total);
        totalLabelCell.font = { bold: true, size: 12 }; totalLabelCell.alignment = { horizontal: 'right' };

        totals.forEach((tot, pIdx) => {
          const timeCol = 2 + (pIdx * 2); const ptsCol = 3 + (pIdx * 2);
          sheet.mergeCells(totalRow, timeCol, totalRow, ptsCol);
          const tCell = sheet.getCell(totalRow, timeCol);
          tCell.value = tot; tCell.font = { bold: true, size: 12 };
          tCell.alignment = { horizontal: 'center' };
          tCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF2CC' } }; 
        });

        let lastRowIndex = totalRow;
        if (isTeamMode) {
          lastRowIndex = totalRow + 1;
          const team1Score = totals.filter((_, i) => i < halfLen).reduce((a, b) => a + b, 0);
          const team2Score = totals.filter((_, i) => i >= halfLen).reduce((a, b) => a + b, 0);
          
          sheet.mergeCells(lastRowIndex, 1, lastRowIndex, 1);
          const teamLabelCell = sheet.getCell(lastRowIndex, 1);
          teamLabelCell.value = t.teamTotal;
          teamLabelCell.font = { bold: true, size: 14, color: { argb: 'FFFFFFFF' } };
          teamLabelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF334155' } }; 
          teamLabelCell.alignment = { horizontal: 'right', vertical: 'middle' };

          const totalCols = players.length * 2;
          const halfCols = Math.floor(totalCols / 2);
          
          sheet.mergeCells(lastRowIndex, 2, lastRowIndex, 1 + halfCols);
          const t1Cell = sheet.getCell(lastRowIndex, 2);
          t1Cell.value = `${displayTeam1Name}: ${team1Score}`;
          t1Cell.font = { bold: true, size: 16, color: { argb: 'FFFFFFFF' } };
          t1Cell.alignment = { horizontal: 'center', vertical: 'middle' };
          t1Cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1D4ED8' } }; 

          if (players.length > 1) {
            sheet.mergeCells(lastRowIndex, 2 + halfCols, lastRowIndex, 1 + totalCols);
            const t2Cell = sheet.getCell(lastRowIndex, 2 + halfCols);
            t2Cell.value = `${displayTeam2Name}: ${team2Score}`;
            t2Cell.font = { bold: true, size: 16, color: { argb: 'FFFFFFFF' } };
            t2Cell.alignment = { horizontal: 'center', vertical: 'middle' };
            t2Cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB91C1C' } }; 
          }
          sheet.getRow(lastRowIndex).height = 30;
        }

        sheet.getColumn(1).width = 30;
        players.forEach((_, i) => { sheet.getColumn(2 + (i * 2)).width = 12; sheet.getColumn(3 + (i * 2)).width = 8; });
        sheet.eachRow((row, rowNumber) => {
          if (rowNumber > 1 && rowNumber <= lastRowIndex) row.eachCell((cell) => { cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } }; });
        });

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = window.URL.createObjectURL(blob);
        const anchor = document.createElement('a'); anchor.href = url;
        anchor.download = `Leaderboard_${new Date().getTime()}.xlsx`; anchor.click();
        window.URL.revokeObjectURL(url);
      };

      const getGameCalculations = (gameIndex, times) => {
        const parsed = times.map(parseTime);
        const valids = parsed.filter(t => t !== null);
        const bestTime = valids.length > 0 ? Math.min(...valids) : null;

        return parsed.map((timeMs, pIndex) => {
          if (gameMode === '1v1') {
             const isBest = timeMs === bestTime && timeMs !== null;
             return { score: isBest ? 1 : 0, isBest: isBest, isKingMap: false, colorClass: isBest ? 'text-amber-950 bg-amber-400 font-black shadow-[0_5px_15px_rgba(251,191,36,0.4)] border-amber-300' : 'text-slate-500 bg-slate-900/80 border-transparent' };
          }
          let kingMapGameIndex = pIndex + 1;
          if (gameMode !== 'solo') {
             const H = Math.floor(players.length / 2);
             if (pIndex < H) kingMapGameIndex = 1 + pIndex * 2; 
             else kingMapGameIndex = 2 + (pIndex - H) * 2; 
          }
          const isKingMap = (gameIndex === kingMapGameIndex); 
          if (timeMs === null) return { score: 0, isBest: false, isKingMap, colorClass: 'text-slate-600 bg-slate-900/50 border-transparent' };
          
          const isBest = (timeMs === bestTime);
          let score = 0, colorClass = 'text-cyan-400 bg-slate-800/80 border-transparent hover:border-slate-600';

          if (isBest) {
            score = isKingMap ? KING_TOP_SCORE : NORMAL_TOP_SCORE;
            colorClass = isKingMap ? 'text-red-100 bg-red-600 font-black shadow-[0_5px_15px_rgba(220,38,38,0.4)] border-red-400' : 'text-amber-950 bg-amber-400 font-black shadow-[0_5px_15px_rgba(251,191,36,0.4)] border-amber-300'; 
          } else {
            const diffSec = Math.floor((timeMs - bestTime) / 1000);
            score = Math.max(0, 10 - diffSec);
            if (score === 0) colorClass = 'text-slate-500 bg-slate-900/80 border-transparent'; 
          }
          return { score, isBest, isKingMap, colorClass };
        });
      };

      const totals = useMemo(() => {
        if (gameMode === '1v1' && matchStatus1v1) return [matchStatus1v1.p1Rounds, matchStatus1v1.p2Rounds];
        const sums = Array(players.length).fill(0);
        games.forEach((g, gIdx) => { getGameCalculations(gIdx, g.times).forEach((c, pIdx) => { if (pIdx < players.length) sums[pIdx] += c.score; }); });
        return sums;
      }, [games, players, gameMode, matchStatus1v1]);

      const activeLeaderboard = useMemo(() => {
        const halfLen = Math.floor(players.length / 2);
        if (isTeamMode) {
          const team1Score = totals.filter((_, i) => i < halfLen).reduce((a, b) => a + b, 0);
          const team2Score = totals.filter((_, i) => i >= halfLen).reduce((a, b) => a + b, 0);
          const teams = [
            { id: 'team1', name: displayTeam1Name, playersStr: players.filter((_, i) => i < halfLen).join(' & '), score: team1Score, isT1: true },
            { id: 'team2', name: displayTeam2Name, playersStr: players.filter((_, i) => i >= halfLen).join(' & '), score: team2Score, isT1: false }
          ];
          if (players.length < 2) teams.pop();
          const sorted = teams.sort((a, b) => b.score - a.score);
          let currentRank = 1;
          return sorted.map((item, index) => { if (index > 0 && item.score < sorted[index - 1].score) currentRank = index + 1; return { ...item, rank: currentRank }; });
        } else {
          const sorted = players.map((name, i) => ({ name, score: totals[i], id: `p_${i}`, oIndex: i })).sort((a, b) => b.score - a.score);
          let currentRank = 1;
          return sorted.map((item, index) => { if (index > 0 && item.score < sorted[index - 1].score) currentRank = index + 1; return { ...item, rank: currentRank }; });
        }
      }, [players, totals, isTeamMode, displayTeam1Name, displayTeam2Name]);

      const nextPickerData = useMemo(() => {
        const nextIdx = games.findIndex(g => { return g.times.slice(0, players.length).every(time => !time || time.trim() === ''); });

        if (gameMode === '1v1') {
            let lastPlayedIdx = -1;
            for (let i = games.length - 1; i >= 0; i--) {
                const t1 = games[i].times[0]; const t2 = games[i].times[1];
                if ((t1 && t1.trim() !== '') || (t2 && t2.trim() !== '')) { lastPlayedIdx = i; break; }
            }
            if (lastPlayedIdx === -1) return { show: true, text: t.map1Pick };

            const winCond = Math.ceil(soloSetBO / 2);
            let s_p1Rounds = 0, s_p2Rounds = 0, lastGameWinner = -1; 

            for (let s = 1; s <= soloMatchBO; s++) {
                s_p1Rounds = 0; s_p2Rounds = 0;
                for (let r = 1; r <= soloSetBO; r++) {
                    const gIdx = (s - 1) * soloSetBO + (r - 1);
                    if (gIdx > lastPlayedIdx) break; 
                    const g = games[gIdx];
                    const t1 = g.times[0]; const t2 = g.times[1];
                    const isT1Final = t1 && (t1.includes(':') || t1.toUpperCase() === 'X');
                    const isT2Final = t2 && (t2.includes(':') || t2.toUpperCase() === 'X');
                    let winner = -1;
                    if (isT1Final && isT2Final) {
                        const v1 = parseTime(t1); const v2 = parseTime(t2);
                        const p1DNF = t1.toUpperCase() === 'X', p2DNF = t2.toUpperCase() === 'X';
                        if (v1 !== null && v2 !== null) winner = v1 < v2 ? 0 : (v2 < v1 ? 1 : -1);
                        else if (v1 !== null || p2DNF) winner = 0;
                        else if (v2 !== null || p1DNF) winner = 1;
                    }
                    if (winner === 0) s_p1Rounds++;
                    if (winner === 1) s_p2Rounds++;
                    if (gIdx === lastPlayedIdx) lastGameWinner = winner; 
                    if (s_p1Rounds >= winCond || s_p2Rounds >= winCond) break; 
                }
                if (lastPlayedIdx < s * soloSetBO) break;
            }

            let pickerIndex = 0;
            let isNewSet = (s_p1Rounds >= winCond || s_p2Rounds >= winCond);

            if (isNewSet) { pickerIndex = s_p1Rounds >= winCond ? 1 : 0;
            } else {
                if (s_p1Rounds < s_p2Rounds) pickerIndex = 0; 
                else if (s_p2Rounds < s_p1Rounds) pickerIndex = 1; 
                else {
                    if (lastGameWinner === 0) pickerIndex = 1; 
                    else if (lastGameWinner === 1) pickerIndex = 0; 
                    else {
                        const lastG = games[lastPlayedIdx];
                        const v1 = parseTime(lastG.times[0]); const v2 = parseTime(lastG.times[1]);
                        if (v1 !== null && v2 !== null) pickerIndex = v1 > v2 ? 0 : 1;
                        else pickerIndex = 0;
                    }
                }
            }

            const pickerName = players[pickerIndex];
            let nextAssign = matchStatus1v1?.gameAssignments[lastPlayedIdx + 1];
            if (isNewSet) { const currentSet = Math.floor(lastPlayedIdx / soloSetBO) + 1; nextAssign = { set: currentSet + 1, round: 1 }; }
            
            let displayText = "";
            if (nextAssign) displayText = lang === 'vi' ? `SET ${nextAssign.set} - GAME ${nextAssign.round}: LƯỢT CHỌN MAP CỦA ${pickerName}` : `SET ${nextAssign.set} - GAME ${nextAssign.round}: ${pickerName}'S PICK`;
            else displayText = t.normalPick.replace('{0}', lastPlayedIdx + 2).replace('{1}', pickerName);

            return { show: true, text: displayText, pIndex: pickerIndex };
        }

        if (nextIdx === -1) return { show: false }; 
        if (nextIdx === 0) return { show: true, text: t.map1Pick }; 

        const actualLastGameIndex = nextIdx - 1; 

        if (nextIdx >= 1 && nextIdx < players.length + 1) {
            let kingPlayerIndex = nextIdx - 1;
            if (isTeamMode) {
                const H = Math.floor(players.length / 2);
                if (nextIdx % 2 !== 0) kingPlayerIndex = Math.floor((nextIdx - 1) / 2);
                else kingPlayerIndex = H + Math.floor((nextIdx - 2) / 2);
            }
            const pickerName = players[kingPlayerIndex];
            return { show: true, text: t.kingMapPick.replace('{0}', nextIdx + 1).replace('{1}', pickerName), pIndex: kingPlayerIndex };
        }

        const halfLen = Math.floor(players.length / 2);
        if (isTeamMode) {
          const t1Score = totals.filter((_, i) => i < halfLen).reduce((a, b) => a + b, 0);
          const t2Score = totals.filter((_, i) => i >= halfLen).reduce((a, b) => a + b, 0);
          let isT1 = true;
          if (t1Score < t2Score) isT1 = true;
          else if (t2Score < t1Score) isT1 = false;
          else {
              const lastGameCalcs = getGameCalculations(actualLastGameIndex, games[actualLastGameIndex].times);
              const lastT1Score = lastGameCalcs.filter((_, i) => i < halfLen).reduce((a, b) => a + b.score, 0);
              const lastT2Score = lastGameCalcs.filter((_, i) => i >= halfLen).reduce((a, b) => a + b.score, 0);
              isT1 = lastT1Score <= lastT2Score;
          }
          const teamName = isT1 ? displayTeam1Name : displayTeam2Name;
          const colorClass = isT1 ? 'text-blue-400' : 'text-red-400';
          return { show: true, text: t.normalPick.replace('{0}', nextIdx + 1).replace('{1}', teamName), isT1, colorClass };
        } else {
          const lastGameTimes = games[actualLastGameIndex].times.map(parseTime);
          const pStats = players.map((_, i) => ({ index: i, total: totals[i], lastTimeMs: lastGameTimes[i] === null ? Infinity : lastGameTimes[i] }));
          pStats.sort((a, b) => b.total - a.total);
          if (pStats.length < 2) return { show: false };
          let targetPlayers = [];
          if (pStats[0].total === pStats[1].total) {
              const topScore = pStats[0].total; targetPlayers = pStats.filter(p => p.total === topScore);
          } else {
              const secondScore = pStats[1].total; targetPlayers = pStats.filter(p => p.total === secondScore);
          }
          targetPlayers.sort((a, b) => b.lastTimeMs - a.lastTimeMs);
          const pickerIndex = targetPlayers[0].index;
          const pickerName = players[pickerIndex];
