      tw: { title: "秒數計分系統", subtitle: "由 koi 設計與開發", addPlayer: "新增選手", addMatch: "新增比賽", reset: "重置", export: "匯出表格", no: "序號", match: "比賽", kingMap: "王牌賽道", total: "總分", leaderboard: "排行榜", pts: "分", errMaxP: "最多允許 6 名選手！", errMinP: "至少需要 2 名選手！", errMaxG: `最多允許 ${MAX_GAMES} 場比賽！`, delP: "是否將 {0} 移出比賽？", errMinG: "至少需要 1 場比賽！", delG: "確定要刪除 第{0}場 嗎？", confirmReset: "🚨 重置計分板？\n所有數據將被清除並恢復為預設狀態。", defPlayer: "選手", defGame: "比賽", selectMap: "搜尋賽道", searchPh: "輸入賽道名稱...", infoBtn: "指南", infoTitle: "計分規則與使用方法", i1: "快速輸入: 直接輸入數字（例：10704 會自動轉為 1:07.04）。", i2: "第一名：11分。", i3: "王牌賽道：選手可選擇自己的王牌賽道。獲得第一名可得 12分。", i4: "後續選手根據落後時間扣分：", i5: "未完成（輸入 X）：0分。", soloMode: "單人賽", teamMode: "組隊賽", indivTotal: "個人總分", teamTotal: "隊伍總分" },
      th: { title: "ระบบการนับคะแนนตามวินาที", subtitle: "ออกแบบและพัฒนาโดย koi", addPlayer: "เพิ่มผู้เล่น", addMatch: "เพิ่มแข่ง", reset: "รีเซ็ต", export: "ส่งออก Excel", no: "ลำดับ", match: "การแข่งขัน", kingMap: "แผนที่คิง", total: "คะแนนรวม", leaderboard: "ตารางคะแนน", pts: "แต้ม", errMaxP: "อนุญาตสูงสุด 6 คน!", errMinP: "ต้องมีอย่างน้อย 2 คน!", errMaxG: `อนุญาตสูงสุด ${MAX_GAMES} นัด!`, delP: "ลบ {0} ออกหรือไม่?", errMinG: "ต้องมีอย่างน้อย 1 นัด!", delG: "ลบ เกมที่ {0} หรือไม่?", confirmReset: "🚨 รีเซ็ตกระดานคะแนน?\nข้อมูลทั้งหมดจะถูกลบและกลับสู่ค่าเริ่มต้น", defPlayer: "ผู้เล่น", defGame: "เกม", selectMap: "ค้นหาแผนที่", searchPh: "พิมพ์ชื่อแผนที่...", infoBtn: "คู่มือ", infoTitle: "กฎการให้คะแนนและการใช้งาน", i1: "ป้อนข้อมูลด่วน: พิมพ์ตัวเลข (เช่น 10704 จะกลายเป็น 1:07.04)", i2: "อันดับ 1: 11 แต้ม", i3: "King Map: ผู้เล่นเลือก King Map ของตัวเอง หากได้อันดับ 1 ใน King Map จะได้ +12 แต้ม", i4: "ผู้เล่นคนอื่นจะถูกหักคะแนนตามช่องว่างเวลา:", i5: "ไม่จบการแข่งขัน (พิมพ์ X): 0 แต้ม", soloMode: "แข่งเดี่ยว", teamMode: "แข่งทีม", indivTotal: "คะแนนส่วนตัว", teamTotal: "คะแนนทีมรวม" }
    };

    // Lấy tên map chuẩn theo từng ngôn ngữ (Thái Lan dùng map tiếng Anh)
    const getMapName = (id, lang) => {
      const mapLang = lang === 'th' ? 'en' : lang;
      for (const group of MAP_POOL) {
        const found = group.maps.find(m => m.id === id);
        if (found) return found[mapLang];
      }
      return '';
    };

    const parseTime = (val) => {
      if (!val || val.toUpperCase() === 'X') return null;
      if (val.includes(':') || val.includes('.')) {
        let m = 0, s = 0, c = 0;
        const parts = val.replace(',', '.').split(/[:.]/);
        if (parts.length === 3) [m, s, c] = parts.map(Number);
        else if (parts.length === 2) [s, c] = parts.map(Number);
        else return null;
        if (isNaN(m) || isNaN(s) || isNaN(c)) return null;
        return (m * 60000) + (s * 1000) + (c * 10);
      }
      const digits = val.replace(/\D/g, '');
      if (!digits) return null;
      let m = 0, s = 0, c = 0;
      if (digits.length >= 5) {
        c = Number(digits.slice(-2)); s = Number(digits.slice(-4, -2)); m = Number(digits.slice(0, -4));
      } else if (digits.length >= 3) {
        c = Number(digits.slice(-2)); s = Number(digits.slice(0, -2));
      } else {
        c = Number(digits);
      }
      return (m * 60000) + (s * 1000) + (c * 10);
    };

    const formatTimeDisplay = (val) => {
      if (!val) return '';
      if (val.toUpperCase() === 'X') return 'X';
      const ms = parseTime(val);
      if (ms === null) return val; 
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const c = Math.floor((ms % 1000) / 10);
      return `${m}:${s.toString().padStart(2, '0')}.${c.toString().padStart(2, '0')}`;
    };

    // --- CUSTOM SEARCHABLE DROPDOWN CHUYÊN NGHIỆP ---
    const SearchableMapSelect = ({ gameIndex, currentMapId, selectedMaps, onChange, lang, t }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const wrapperRef = useRef(null);

      useEffect(() => {
        function handleClickOutside(event) {
          if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
            setIsOpen(false);
            setSearchTerm('');
          }
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const currentName = currentMapId ? getMapName(currentMapId, lang) : '';

      return (
        <div ref={wrapperRef} className={`relative w-full ${isOpen ? 'z-[100]' : 'z-20'}`}>
          <div 
            onClick={() => setIsOpen(!isOpen)}
            className={`w-full flex items-center justify-between bg-slate-950/80 border ${isOpen ? 'border-red-500 ring-1 ring-red-500' : 'border-slate-700 hover:border-slate-500'} rounded px-2 py-1.5 cursor-pointer transition-all`}
          >
            <span className={`text-[10px] md:text-xs font-bold truncate ${currentName ? 'text-cyan-300' : 'text-slate-500'}`}>
              {currentName || t.selectMap}
            </span>
            <ChevronDown size={14} className={`text-slate-400 transition-transform ${isOpen ? 'rotate-180' : ''}`} />
          </div>

          {isOpen && (
            <div className="absolute top-full left-0 mt-1 w-[200px] md:w-full min-w-[160px] bg-slate-900 border border-slate-700 rounded-md shadow-2xl max-h-60 overflow-y-auto z-[100]">
              <div className="sticky top-0 bg-slate-900 p-2 border-b border-slate-700">
                <input 
                  type="text"
                  autoFocus
                  placeholder={t.searchPh}
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white outline-none focus:border-red-500"
                />
              </div>
              <div className="p-1">
                <div 
                  className="px-2 py-1.5 text-xs text-slate-400 hover:bg-slate-800 rounded cursor-pointer mb-1"
                  onClick={() => { onChange(''); setIsOpen(false); setSearchTerm(''); }}
                >
                  -- {t.selectMap} --
                </div>
                {MAP_POOL.map(group => {
                  const mapLang = lang === 'th' ? 'en' : lang;
                  const filteredMaps = group.maps.filter(m => m[mapLang].toLowerCase().includes(searchTerm.toLowerCase()));
                  if (filteredMaps.length === 0) return null;
                  
                  return (
                    <div key={group.stars} className="mb-2">
                      <div className="px-2 py-1 text-[10px] font-black text-red-500 uppercase bg-slate-950/50">
                        {`★`.repeat(group.stars)} {group.stars} {lang==='vi'?'Sao':lang==='en'?'Stars':'星'}
                      </div>
                      {filteredMaps.map(m => {
                        const isSelectedByOther = selectedMaps.includes(m.id) && m.id !== currentMapId;
                        return (
                          <div 
                            key={m.id}
                            onClick={() => {
                              if (!isSelectedByOther) { onChange(m.id); setIsOpen(false); setSearchTerm(''); }
                            }}
                            className={`px-2 py-1.5 text-xs rounded transition-colors ${
                              isSelectedByOther ? 'text-slate-600 cursor-not-allowed line-through' :
                              m.id === currentMapId ? 'bg-red-900/40 text-red-400 font-bold' :
                              'text-slate-300 hover:bg-slate-800 cursor-pointer'
                            }`}
                          >
                            {m[mapLang]}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    };

    function App() {
      // --- STATE ---
      const [lang, setLang] = useState(() => localStorage.getItem('zsm_lang_v10_final') || 'vi');
      const t = TRANSLATIONS[lang];
      const [showInfo, setShowInfo] = useState(false);
      
      const [isTeamMode, setIsTeamMode] = useState(() => {
        return localStorage.getItem('zsm_team_mode_v10') === 'true';
      });

      const [players, setPlayers] = useState(() => {
        const saved = localStorage.getItem('zsm_players_v10_final');
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        return [`${t.defPlayer} 1`, `${t.defPlayer} 2`, `${t.defPlayer} 3`, `${t.defPlayer} 4`];
      });

      const [games, setGames] = useState(() => {
        const saved = localStorage.getItem('zsm_games_v10_final');
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        return Array(9).fill(null).map((_, i) => ({
          id: Date.now() + i,
          mapId: "",
          times: Array(4).fill('')
        }));
      });

      // --- DYNAMIC TRANSLATION HOOK ---
      useEffect(() => {
        const allDefP = Object.values(TRANSLATIONS).map(tr => tr.defPlayer);
        const currentT = TRANSLATIONS[lang];
        setPlayers(prev => prev.map(p => {
          for (let def of allDefP) {
            if (p.startsWith(def + ' ')) {
              const num = p.replace(def + ' ', '');
              if (!isNaN(num)) return `${currentT.defPlayer} ${num}`;
            }
          }
          return p;
        }));
      }, [lang]);

      // --- AUTO SAVE ---
      useEffect(() => { localStorage.setItem('zsm_lang_v10_final', lang); }, [lang]);
      useEffect(() => { localStorage.setItem('zsm_team_mode_v10', isTeamMode); }, [isTeamMode]);
      useEffect(() => { localStorage.setItem('zsm_players_v10_final', JSON.stringify(players)); }, [players]);
      useEffect(() => { localStorage.setItem('zsm_games_v10_final', JSON.stringify(games)); }, [games]);

      // --- EVENTS ---
      const handleTimeChange = (gIndex, pIndex, val) => {
        const newGames = [...games]; newGames[gIndex].times[pIndex] = val; setGames(newGames);
      };

      const handleTimeBlur = (gIndex, pIndex) => {
        const newGames = [...games]; newGames[gIndex].times[pIndex] = formatTimeDisplay(newGames[gIndex].times[pIndex]); setGames(newGames);
      };

      const addPlayer = () => {
        if (players.length >= MAX_PLAYERS) return alert(t.errMaxP);
        const newPlayers = [...players, `${t.defPlayer} ${players.length + 1}`];
        const newGames = games.map(g => ({ ...g, times: [...g.times, ''] }));
        setPlayers(newPlayers); setGames(newGames);
      };

      const removePlayer = (pIndex) => {
        if (players.length <= 2) return alert(t.errMinP);
        if (confirm(t.delP.replace('{0}', players[pIndex]))) {
          setPlayers(players.filter((_, i) => i !== pIndex));
          setGames(games.map(g => ({ ...g, times: g.times.filter((_, i) => i !== pIndex) })));
        }
      };

      const addGame = () => {
        if (games.length >= MAX_GAMES) return alert(t.errMaxG);
        setGames([...games, { id: Date.now(), mapId: "", times: Array(players.length).fill('') }]);
      };

      const removeGame = (gIndex) => {
        if (games.length <= 1) return alert(t.errMinG);
        if (confirm(t.delG.replace('{0}', gIndex + 1))) setGames(games.filter((_, i) => i !== gIndex));
      };

      const clearAll = () => {
        if (confirm(t.confirmReset)) {
          setPlayers([`${t.defPlayer} 1`, `${t.defPlayer} 2`, `${t.defPlayer} 3`, `${t.defPlayer} 4`]);
          setGames(Array(9).fill(null).map((_, i) => ({ id: Date.now() + i, mapId: "", times: Array(4).fill('') })));
        }
      };

      // --- Map List to Block Duplicates ---
      const selectedMaps = useMemo(() => {
        return games.map(g => g.mapId).filter(id => id !== "");
      }, [games]);

      // --- EXPORT PROFESSIONAL EXCEL WITH EXCELJS ---
      const exportProfessionalExcel = async () => {
        const workbook = new ExcelJS.Workbook();
        const sheet = workbook.addWorksheet('Leaderboard');

        const lastColIndex = 2 + (players.length * 2);
        sheet.mergeCells(1, 1, 1, lastColIndex);
        const titleCell = sheet.getCell(1, 1);
        titleCell.value = t.title + (isTeamMode ? ` - ${t.teamMode}` : ` - ${t.soloMode}`);
        titleCell.font = { bold: true, size: 16, color: { argb: 'FFFFFFFF' } };
        titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
        titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
        sheet.getRow(1).height = 40;

        sheet.getCell(2, 1).value = t.no;
        sheet.getCell(2, 2).value = t.match;
        sheet.getCell(2, 1).font = { bold: true };
        sheet.getCell(2, 2).font = { bold: true };
        
        players.forEach((p, i) => {
          const timeCol = 3 + (i * 2);
          const ptsCol = 4 + (i * 2);
          
          sheet.mergeCells(2, timeCol, 2, ptsCol);
          const pCell = sheet.getCell(2, timeCol);
          pCell.value = p;
          pCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDDEBF7' } }; 
          pCell.font = { bold: true };
          pCell.alignment = { horizontal: 'center' };

          sheet.getCell(3, timeCol).value = "Time";
          sheet.getCell(3, ptsCol).value = t.pts;
          sheet.getCell(3, ptsCol).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE2EFDA' } }; 
        });

        sheet.getRow(2).alignment = { horizontal: 'center', vertical: 'middle' };
        sheet.getRow(3).alignment = { horizontal: 'center', vertical: 'middle' };
        sheet.getRow(2).height = 25;

        games.forEach((game, gIndex) => {
          const rowNum = 4 + gIndex;
          sheet.getCell(rowNum, 1).value = gIndex + 1;
          
          const mapName = game.mapId ? getMapName(game.mapId, lang) : '';
          sheet.getCell(rowNum, 2).value = `${t.defGame} ${gIndex + 1}${mapName ? ` - ${mapName}` : ''}`;
          
          const calcs = getGameCalculations(gIndex, game.times);
          game.times.forEach((time, pIdx) => {
            const timeCol = 3 + (pIdx * 2);
            const ptsCol = 4 + (pIdx * 2);
            const score = calcs[pIdx].score;
            
            sheet.getCell(rowNum, timeCol).value = time || "-";
            sheet.getCell(rowNum, ptsCol).value = time ? score : 0;

            sheet.getCell(rowNum, timeCol).alignment = { horizontal: 'center' };
            sheet.getCell(rowNum, ptsCol).alignment = { horizontal: 'center' };

            if (calcs[pIdx].isBest) {
              const bgColor = calcs[pIdx].isKingMap ? 'FFFF6666' : 'FFFFFF99'; 
              const fontColor = calcs[pIdx].isKingMap ? 'FF9C0006' : 'FF000000'; 
              
              sheet.getCell(rowNum, timeCol).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgColor } };
              sheet.getCell(rowNum, ptsCol).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgColor } };
              sheet.getCell(rowNum, ptsCol).font = { bold: true, color: { argb: fontColor } };
            }
          });
        });

        const totalRow = 4 + games.length;
        sheet.mergeCells(totalRow, 1, totalRow, 2);
        const totalLabelCell = sheet.getCell(totalRow, 1);
        totalLabelCell.value = isTeamMode ? t.indivTotal : t.total;
        totalLabelCell.font = { bold: true, size: 12 };
        totalLabelCell.alignment = { horizontal: 'right' };

        totals.forEach((tot, pIdx) => {
          const timeCol = 3 + (pIdx * 2);
          const ptsCol = 4 + (pIdx * 2);
          sheet.mergeCells(totalRow, timeCol, totalRow, ptsCol);
          const tCell = sheet.getCell(totalRow, timeCol);
          tCell.value = tot;
          tCell.font = { bold: true, size: 12 };
          tCell.alignment = { horizontal: 'center' };
          tCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF2CC' } }; 
        });

        let lastRowIndex = totalRow;

        // XỬ LÝ ROW TỔNG ĐIỂM ĐỘI (NẾU BẬT TEAM MODE)
        if (isTeamMode) {
          lastRowIndex = totalRow + 1;
          sheet.mergeCells(lastRowIndex, 1, lastRowIndex, 2);
          const teamLabelCell = sheet.getCell(lastRowIndex, 1);
          teamLabelCell.value = t.teamTotal;
          teamLabelCell.font = { bold: true, size: 14, color: { argb: 'FFFFFFFF' } };
          teamLabelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD97706' } }; // Amber-600
          teamLabelCell.alignment = { horizontal: 'right', vertical: 'middle' };

          for (let i = 0; i < Math.ceil(players.length / 2); i++) {
            const teamScore = (totals[i * 2] || 0) + (totals[i * 2 + 1] || 0);
            const startCol = 3 + (i * 2 * 2);
            const endCol = (i * 2 + 1 < players.length) ? 4 + ((i * 2 + 1) * 2) : 4 + (i * 2 * 2);

            sheet.mergeCells(lastRowIndex, startCol, lastRowIndex, endCol);
            const teamCell = sheet.getCell(lastRowIndex, startCol);
            teamCell.value = teamScore;
            teamCell.font = { bold: true, size: 16, color: { argb: 'FFFFFFFF' } };
            teamCell.alignment = { horizontal: 'center', vertical: 'middle' };
            teamCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB45309' } }; // Amber-700
          }
          sheet.getRow(lastRowIndex).height = 30;
        }

        sheet.getColumn(1).width = 8;
        sheet.getColumn(2).width = 30;
        players.forEach((_, i) => {
          sheet.getColumn(3 + (i * 2)).width = 12;
          sheet.getColumn(4 + (i * 2)).width = 8; 
        });

        sheet.eachRow((row, rowNumber) => {
          if (rowNumber > 1 && rowNumber <= lastRowIndex) {
            row.eachCell((cell) => {
              cell.border = {
                top: { style: 'thin' }, left: { style: 'thin' },
                bottom: { style: 'thin' }, right: { style: 'thin' }
              };
            });
          }
        });

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = window.URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = `Leaderboard_${new Date().getTime()}.xlsx`;
        anchor.click();
        window.URL.revokeObjectURL(url);
      };

      // --- LOGIC TÍNH ĐIỂM ---
      const getGameCalculations = (gameIndex, times) => {
        const parsed = times.map(parseTime);
        const valids = parsed.filter(t => t !== null);
        const bestTime = valids.length > 0 ? Math.min(...valids) : null;

        return parsed.map((timeMs, pIndex) => {
          const isKingMap = (gameIndex === pIndex + 1); 
          if (timeMs === null) return { score: 0, isBest: false, isKingMap, colorClass: 'text-slate-600 bg-slate-900/50 border-transparent' };
          
          const isBest = (timeMs === bestTime);
          let score = 0, colorClass = 'text-cyan-400 bg-slate-800/80 border-transparent hover:border-slate-600';

          if (isBest) {
            score = isKingMap ? KING_TOP_SCORE : NORMAL_TOP_SCORE;
            colorClass = isKingMap 
              ? 'text-red-100 bg-red-600 font-black shadow-[0_5px_15px_rgba(220,38,38,0.4)] border-red-400' 
              : 'text-amber-950 bg-amber-400 font-black shadow-[0_5px_15px_rgba(251,191,36,0.4)] border-amber-300'; 
          } else {
            const diffSec = Math.floor((timeMs - bestTime) / 1000);
            score = Math.max(0, 10 - diffSec);
            if (score === 0) colorClass = 'text-slate-500 bg-slate-900/80 border-transparent'; 
          }
          return { score, isBest, isKingMap, colorClass };
        });
      };

      const totals = useMemo(() => {
        const sums = Array(players.length).fill(0);
        games.forEach((g, gIdx) => { getGameCalculations(gIdx, g.times).forEach((c, pIdx) => sums[pIdx] += c.score); });
        return sums;
      }, [games, players]);

      // --- LOGIC BẢNG XẾP HẠNG THEO CHẾ ĐỘ ---
      const activeLeaderboard = useMemo(() => {
        if (isTeamMode) {
          const teams = [];
          for (let i = 0; i < players.length; i += 2) {
            const p1 = players[i];
            const p2 = players[i + 1];
            const score = (totals[i] || 0) + (totals[i + 1] || 0);
            const name = p2 ? `${p1} & ${p2}` : p1;
            teams.push({ id: `team_${i}`, name, score });
          }
          const sorted = teams.sort((a, b) => b.score - a.score);
          let currentRank = 1;
          return sorted.map((item, index) => {
            if (index > 0 && item.score < sorted[index - 1].score) currentRank = index + 1; 
            return { ...item, rank: currentRank };
          });
        } else {
          const sorted = players.map((name, i) => ({ name, score: totals[i], id: `p_${i}` })).sort((a, b) => b.score - a.score);
          let currentRank = 1;
          return sorted.map((item, index) => {
            if (index > 0 && item.score < sorted[index - 1].score) currentRank = index + 1; 
            return { ...item, rank: currentRank };
          });
        }
      }, [players, totals, isTeamMode]);

      return (
        <div className="min-h-screen relative overflow-x-hidden pb-20">
          
          {/* INFO MODAL */}
          {showInfo && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-slide-up" onClick={() => setShowInfo(false)}>
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full shadow-[0_0_40px_rgba(220,38,38,0.2)] overflow-hidden" onClick={e => e.stopPropagation()}>
                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                  <h3 className="font-black text-amber-400 italic tracking-widest uppercase">{t.infoTitle}</h3>
                  <button onClick={() => setShowInfo(false)} className="text-slate-400 hover:text-red-500 transition-colors"><XIcon size={20}/></button>
                </div>
                <div className="p-5 text-[13px] md:text-sm text-slate-300 space-y-3 font-medium">
                  <div className="flex gap-2 items-start"><span className="text-cyan-400">⌨️</span> <p>{t.i1}</p></div>
                  <div className="flex gap-2 items-start"><span className="text-amber-400">🥇</span> <p>{t.i2}</p></div>
                  <div className="flex gap-2 items-start"><span className="text-red-400">👑</span> <p>{t.i3}</p></div>
                  <div className="flex gap-2 items-start"><span className="text-slate-400">⏱️</span> 
                    <div>
                      <p>{t.i4}</p>
                      <ul className="mt-2 ml-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-400 font-mono space-y-1 w-fit">
                        <li>+0.01s - 0.99s: 10 {t.pts}</li>
                        <li>+1.00s - 1.99s:  9 {t.pts}</li>
                        <li>+2.00s - 2.99s:  8 {t.pts}</li>
                        <li>...</li>
                        <li>+9.00s - 9.99s:  1 {t.pts}</li>
                      </ul>
                    </div>
                  </div>
                  <div className="flex gap-2 items-start"><span className="text-red-500">❌</span> <p>{t.i5}</p></div>
                </div>
              </div>
            </div>
          )}

          {/* LANG SELECTOR */}
          <div className="absolute top-2 right-2 md:top-4 md:right-4 z-50 flex items-center gap-2 bg-slate-900/80 border border-slate-700 px-2 md:px-3 py-1.5 rounded-full backdrop-blur-md shadow-lg transition-transform hover:scale-105">
            <Globe size={14} className="text-slate-400 hidden sm:block" />
            <select value={lang} onChange={(e) => setLang(e.target.value)} className="bg-transparent text-slate-300 text-[10px] md:text-xs font-bold outline-none cursor-pointer appearance-none pr-1 md:pr-2">
              <option value="vi">🇻🇳 VI - Tiếng Việt</option><option value="en">🇬🇧 EN - English</option><option value="cn">🇨🇳 CN - 简体中文</option><option value="tw">🇹🇼 TW - 繁體中文</option><option value="th">🇹🇭 TH - ไทย</option>
            </select>
          </div>

          {/* EFFECTS & BACKGROUND */}
          <div className="fixed inset-0 pointer-events-none z-0">
            <div className="absolute inset-0 bg-[url('https://storage.googleapis.com/chat-staging-context-data/context-images/image_4f4785.jpg')] bg-cover bg-center opacity-40"></div>
            <div className="absolute inset-0 bg-[#050510]/80 backdrop-blur-sm"></div>
            <div className="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:40px_40px] [transform:perspective(500px)_rotateX(60deg)] origin-bottom animate-[pulse_4s_ease-in-out_infinite]"></div>
            <div className="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-red-600/30 blur-[150px] rounded-full mix-blend-screen"></div>
            <div className="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-blue-600/30 blur-[150px] rounded-full mix-blend-screen"></div>
          </div>

          <div className="relative z-10 p-2 md:p-8 max-w-[1400px] mx-auto">
            
            <header className="mb-6 md:mb-8 text-center animate-slide-up mt-8 md:mt-0">
              <div className="inline-flex items-center gap-2 md:gap-4 mb-1 md:mb-2 hover:scale-105 transition-transform duration-300">
                <Flag className="w-5 h-5 md:w-8 md:h-8 text-red-500 italic transform -skew-x-12 hidden sm:block" />
                <h1 className="text-xl sm:text-3xl md:text-5xl font-black italic tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-amber-500 to-yellow-500 uppercase drop-shadow-[0_0_15px_rgba(220,38,38,0.5)]" style={{ transform: 'skewX(-10deg)' }}>
                  {t.title}
                </h1>
                <Flag className="w-5 h-5 md:w-8 md:h-8 text-red-500 italic transform -skew-x-12 hidden sm:block" />
              </div>
              <p className="text-slate-400 text-[10px] md:text-sm tracking-[0.1em] md:tracking-[0.2em] uppercase font-bold">{t.subtitle}</p>
              
              <div className="mt-6 flex flex-wrap justify-center gap-2 md:gap-4 relative z-20">
                <button onClick={() => setShowInfo(true)} className="flex items-center justify-center gap-1 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 bg-amber-900/50 border border-amber-500/50 text-amber-300 hover:bg-amber-600 hover:text-white hover:-translate-y-1 hover:shadow-[0_5px_15px_rgba(245,158,11,0.4)] active:scale-95 font-bold rounded transition-all duration-300 uppercase text-[10px] md:text-xs tracking-wider flex-1 sm:flex-none">
                  <InfoIcon size={14}/> <span className="hidden sm:inline">{t.infoBtn}</span>
                </button>
                <button onClick={() => setIsTeamMode(!isTeamMode)} className="flex items-center justify-center gap-1 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 bg-rose-900/50 border border-rose-500/50 text-rose-300 hover:bg-rose-600 hover:text-white hover:-translate-y-1 hover:shadow-[0_5px_15px_rgba(225,29,72,0.4)] active:scale-95 font-bold rounded transition-all duration-300 uppercase text-[10px] md:text-xs tracking-wider flex-1 sm:flex-none">
                  {isTeamMode ? <User size={14}/> : <Users size={14}/>} <span className="hidden sm:inline">{isTeamMode ? t.soloMode : t.teamMode}</span>
                </button>
                <button onClick={addPlayer} className="flex items-center justify-center gap-1 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 bg-blue-900/50 border border-blue-500/50 text-blue-300 hover:bg-blue-600 hover:text-white hover:-translate-y-1 hover:shadow-[0_5px_15px_rgba(59,130,246,0.4)] active:scale-95 font-bold rounded transition-all duration-300 uppercase text-[10px] md:text-xs tracking-wider flex-1 sm:flex-none">
                  <Plus size={14}/> <span className="hidden sm:inline">{t.addPlayer}</span>
                </button>
                <button onClick={addGame} className="flex items-center justify-center gap-1 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 bg-purple-900/50 border border-purple-500/50 text-purple-300 hover:bg-purple-600 hover:text-white hover:-translate-y-1 hover:shadow-[0_5px_15px_rgba(168,85,247,0.4)] active:scale-95 font-bold rounded transition-all duration-300 uppercase text-[10px] md:text-xs tracking-wider flex-1 sm:flex-none">
                  <Plus size={14}/> <span className="hidden sm:inline">{t.addMatch}</span>
                </button>
                <div className="w-full sm:w-px sm:h-10 bg-slate-700/50 my-1 sm:my-0"></div>
                <button onClick={exportProfessionalExcel} className="flex items-center justify-center gap-1 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 bg-green-900/50 border border-green-500/50 text-green-300 hover:bg-green-600 hover:text-white hover:-translate-y-1 hover:shadow-[0_5px_15px_rgba(34,197,94,0.4)] active:scale-95 font-bold rounded transition-all duration-300 uppercase text-[10px] md:text-xs tracking-wider flex-1 sm:flex-none">
                  <Download size={14}/> {t.export}
                </button>
                <button onClick={clearAll} className="flex items-center justify-center gap-1 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 bg-slate-900 border border-slate-700 text-slate-300 hover:text-red-400 hover:border-red-500 hover:bg-red-900/30 hover:-translate-y-1 hover:shadow-[0_5px_15px_rgba(239,68,68,0.4)] active:scale-95 font-bold rounded transition-all duration-300 uppercase text-[10px] md:text-xs tracking-wider flex-1 sm:flex-none group">
                  <RefreshCcw size={14} className="group-hover:-rotate-180 transition-transform duration-700"/> {t.reset}
                </button>
              </div>
            </header>

            <div className="grid lg:grid-cols-4 gap-4 md:gap-6">
              
              <div className="lg:col-span-3 bg-slate-900/70 backdrop-blur-xl border border-slate-700/50 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] overflow-hidden animate-slide-up delay-100 flex flex-col max-h-[75vh]">
                <div className="overflow-x-auto overflow-y-auto flex-1">
                  <table className="w-full text-xs md:text-sm border-collapse">
                    <thead className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md shadow-md border-b border-slate-700">
                      <tr>
                        <th className="px-1 md:px-2 py-3 text-center w-8 md:w-12 text-slate-500 font-bold">{t.no}</th>
                        <th className="px-1 md:px-2 py-3 text-left w-24 md:w-48 tracking-widest text-slate-300 font-bold whitespace-nowrap">{t.match}</th>
                        {players.map((p, i) => (
                          <th key={i} className={`px-1 md:px-2 py-3 min-w-[80px] md:min-w-[140px] relative group border-b-2 ${isTeamMode && (i%2===0) ? 'border-amber-500/30 bg-white/5' : isTeamMode && (i%2!==0) ? 'border-amber-500/30 bg-white/5' : 'border-transparent'}`}>
                            <input 
                              type="text" value={p}
                              onChange={(e) => { const n=[...players]; n[i]=e.target.value; setPlayers(n); }}
                              className="w-full bg-transparent border-b-2 border-slate-700 focus:border-red-500 outline-none text-center pb-1 text-sm md:text-lg text-white font-bold transition-all duration-300 hover:border-slate-500"
                            />
                            <button onClick={() => removePlayer(i)} className="absolute top-1 right-1 p-1 text-slate-500 hover:text-white hover:bg-red-500 opacity-100 md:opacity-0 group-hover:opacity-100 transition-all bg-slate-800 rounded-full border border-slate-700 shadow-lg">
                              <XIcon size={10}/>
                            </button>
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/50">
                      {games.map((game, gIndex) => {
                        const calcs = getGameCalculations(gIndex, game.times);
                        return (
                          <tr key={game.id} className="hover:bg-slate-800/80 hover:shadow-[0_5px_15px_rgba(0,0,0,0.3)] transition-all duration-300 group">
                            <td className="px-1 md:px-2 py-2 text-center text-slate-600 font-bold font-mono">{gIndex + 1}</td>
                            <td className="px-1 md:px-2 py-2 relative">
                              <div className="flex flex-col gap-0.5 md:gap-1">
                                <div className="flex items-center justify-between">
                                  <span className="text-[9px] md:text-[10px] text-slate-500 font-bold uppercase tracking-widest">{t.defGame} {gIndex + 1}</span>
                                  <button onClick={() => removeGame(gIndex)} className="text-slate-600 hover:text-red-500 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer flex-shrink-0" title={t.delG.replace('{0}', gIndex + 1)}>
                                    <Trash2 size={12} className="md:w-[14px] md:h-[14px]"/>
                                  </button>
                                </div>
                                <SearchableMapSelect 
                                  gameIndex={gIndex} currentMapId={game.mapId} selectedMaps={selectedMaps}
                                  onChange={(id) => { const n = [...games]; n[gIndex].mapId = id; setGames(n); }}
                                  lang={lang} t={t}
                                />
                              </div>
                            </td>
                            
                            {game.times.map((time, pIndex) => {
                              const { score, isKingMap, colorClass } = calcs[pIndex];
                              return (
                                <td key={pIndex} className={`px-1 md:px-2 py-2 relative z-10 ${isTeamMode && pIndex % 2 === 0 ? 'border-l border-white/5' : ''}`}>
                                  <div className={`relative flex flex-col gap-0.5 md:gap-1 p-1 md:p-2 rounded md:rounded-lg border transition-all duration-300 hover:bg-white/[0.05] hover:-translate-y-[1px] hover:shadow-[0_5px_15px_rgba(0,0,0,0.2)] ${colorClass}`}>
                                    {isKingMap && (
                                      <div className="absolute -top-2 md:-top-3 left-1/2 -translate-x-1/2 flex items-center gap-0.5 bg-red-600 px-1 md:px-2 rounded text-[7px] md:text-[9px] uppercase font-bold tracking-widest text-white shadow-[0_0_15px_#dc2626] z-10 whitespace-nowrap animate-pulse">
                                        <Crown size={8} className="md:w-[10px] md:h-[10px]" /> <span className="hidden sm:inline">{t.kingMap}</span>
                                      </div>
                                    )}
                                    <input 
                                      type="text" value={time}
                                      onChange={(e) => handleTimeChange(gIndex, pIndex, e.target.value)}
                                      onBlur={() => handleTimeBlur(gIndex, pIndex)}
                                      placeholder="X"
                                      className={`w-full text-center bg-black/40 border border-slate-700 rounded px-1 py-1 outline-none tracking-widest text-xs md:text-sm transition-all duration-300 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 focus:shadow-[0_0_15px_rgba(34,211,238,0.3)] hover:border-slate-500 hover:bg-black/60 ${time ? 'text-white' : 'text-slate-600'}`}
                                    />
                                    <div className={`mt-0.5 text-center py-0.5 rounded text-[10px] md:text-sm tracking-wider font-bold`}>
                                      {time ? `+${score}` : '-'}
                                    </div>
                                  </div>
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot className="sticky bottom-0 z-30 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
                      {/* Dòng Điểm Cá Nhân */}
                      <tr className={`bg-gradient-to-r from-red-900/90 to-blue-900/90 border-t-4 border-red-600 backdrop-blur-lg ${isTeamMode ? 'border-b border-slate-700/50' : ''}`}>
                        <td colSpan={2} className={`px-2 md:px-4 py-3 md:py-6 text-right font-black uppercase tracking-widest ${isTeamMode ? 'text-[10px] md:text-xs text-slate-400' : 'text-xs md:text-sm text-red-500'}`}>
                          {isTeamMode ? t.indivTotal : t.total}
                        </td>
                        {totals.map((total, i) => (
                          <td key={i} className="px-1 md:px-2 py-3 md:py-6 text-center">
                            <span className={`${isTeamMode ? 'text-sm md:text-xl font-bold text-slate-400 drop-shadow-none' : 'text-xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400 drop-shadow-[0_0_15px_rgba(255,255,255,0.4)] hover:scale-110 inline-block transition-transform duration-300 cursor-default'}`}>
                              {total}
                            </span>
                          </td>
                        ))}
                      </tr>
                      {/* Dòng Điểm Đội - CHỈ HIỂN THỊ KHI TEAM MODE */}
                      {isTeamMode && (
                        <tr className="bg-gradient-to-r from-amber-900/90 to-orange-900/90 backdrop-blur-lg border-t border-amber-500/50 shadow-[0_-5px_20px_rgba(245,158,11,0.2)]">
                          <td colSpan={2} className="px-2 md:px-4 py-3 md:py-5 text-right font-black text-amber-500 uppercase tracking-widest text-xs md:text-sm">
                            {t.teamTotal}
                          </td>
                          {Array.from({ length: Math.ceil(players.length / 2) }).map((_, i) => {
                            const teamScore = (totals[i * 2] || 0) + (totals[i * 2 + 1] || 0);
                            const colSpan = (i * 2 + 1 < players.length) ? 2 : 1;
                            return (
                              <td key={`team_tot_${i}`} colSpan={colSpan} className="px-1 md:px-2 py-3 md:py-5 text-center border-l-2 border-amber-500/30">
                                <span className="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-b from-amber-200 to-amber-500 drop-shadow-[0_0_20px_rgba(245,158,11,0.6)] hover:scale-110 inline-block transition-transform duration-300 cursor-default">
                                  {teamScore}
                                </span>
                              </td>
                            );
                          })}
                        </tr>
                      )}
                    </tfoot>
                  </table>
                </div>
              </div>

              <div className="lg:col-span-1 animate-slide-up delay-200 order-first lg:order-last">
                <div className="bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 rounded-xl overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.6)] hover:shadow-[0_10px_40px_rgba(220,38,38,0.15)] transition-shadow duration-500">
                  <div className="bg-slate-950 px-4 md:px-6 py-3 md:py-5 border-b border-slate-800 flex items-center justify-between">
                    <h2 className="font-black text-white tracking-[0.1em] uppercase italic transform skew-x-[-10deg] text-sm md:text-base cursor-default">{t.leaderboard}</h2>
                    <Flame className="text-red-500 animate-pulse w-4 h-4 md:w-6 md:h-6" />
                  </div>
                  
                  <div className="p-2 md:p-4 space-y-2 md:space-y-3 flex flex-row lg:flex-col overflow-x-auto lg:overflow-x-visible hide-scrollbar gap-2 lg:gap-0">
                    {activeLeaderboard.map((item) => {
                      const isTop1 = item.rank === 1 && item.score > 0;
                      const isTop2 = item.rank === 2 && item.score > 0;
                      const isTop3 = item.rank === 3 && item.score > 0;
                      
                      return (
                        <div 
                          key={item.id} 
                          className={`relative flex items-center justify-between p-2 md:p-3 rounded border min-w-[140px] lg:min-w-0 flex-shrink-0 transition-all duration-300 hover:scale-105 hover:z-10 hover:shadow-[0_10px_20px_rgba(0,0,0,0.5)] hover:bg-slate-800/90 cursor-default
                            ${isTop1 ? 'bg-amber-500/10 border-amber-500 shadow-[inset_0_0_15px_rgba(251,191,36,0.15)]' :
                              isTop2 ? 'bg-slate-400/10 border-slate-400' :
                              isTop3 ? 'bg-orange-700/10 border-orange-600' :
                              'bg-slate-950/50 border-slate-800 hover:border-slate-600'}
                          `}
                        >
                          <div className={`absolute left-0 top-0 bottom-0 w-1 rounded-l ${isTop1?'bg-amber-400':isTop2?'bg-slate-300':isTop3?'bg-orange-500':'bg-slate-700'}`}></div>

                          <div className="flex items-center gap-2 md:gap-3 pl-1 md:pl-2 min-w-0 flex-1">
                            <div className={`flex-shrink-0 w-6 h-6 md:w-8 md:h-8 rounded bg-black/50 border flex items-center justify-center font-black italic text-xs md:text-sm shadow-inner
                              ${isTop1 ? 'text-amber-400 border-amber-500/50 shadow-[0_0_15px_rgba(251,191,36,0.4)]' :
                                isTop2 ? 'text-slate-300 border-slate-400/50' :
                                isTop3 ? 'text-orange-400 border-orange-500/50' :
                                'text-slate-600 border-slate-700'}
                            `}>
                              #{item.rank}
                            </div>
                            <span className={`font-bold tracking-wider text-xs md:text-sm truncate pr-2 ${isTeamMode ? 'max-w-[80px] md:max-w-[130px]' : 'max-w-[60px] md:max-w-[100px]'} ${isTop1 ? 'text-white' : 'text-slate-300'}`}>
                              {item.name}
                            </span>
                          </div>
                          
                          <div className="flex items-baseline gap-0.5 md:gap-1 flex-shrink-0">
                            <span className={`text-lg md:text-2xl font-black ${isTop1 ? 'text-amber-400 drop-shadow-[0_0_10px_rgba(251,191,36,0.8)]' : 'text-white'}`}>
                              {item.score}
                            </span>
                            <span className="text-[8px] md:text-[10px] text-slate-500 font-bold tracking-widest uppercase hidden sm:inline">{t.pts}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
