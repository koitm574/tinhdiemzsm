    const Trash2 = ({size=24, className=""}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width={size} height={size}><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2m-6 5v6m4-6v6"></path></svg>;
    const XIcon = ({size=24, className=""}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width={size} height={size}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const Globe = ({size=24, className=""}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width={size} height={size}><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>;
    const Download = ({size=24, className=""}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width={size} height={size}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;

    // --- TRANSLATIONS ---
    const TRANSLATIONS = {
      vi: {
        title: "HỆ THỐNG TÍNH ĐIỂM THEO GIÂY", subtitle: "Thiết kế và phát triển bởi koi",
        addPlayer: "Thêm VĐV", addMatch: "Thêm Trận", reset: "Làm mới", export: "Xuất Excel",
        no: "STT", match: "TRẬN ĐẤU", kingMap: "King Map", total: "TỔNG ĐIỂM", leaderboard: "BẢNG XẾP HẠNG", pts: "PTS",
        errMaxP: "Giải đấu giới hạn tối đa 6 VĐV!", errMinP: "Bảng thi đấu cần ít nhất 2 VĐV!", errMaxG: "Giải đấu giới hạn tối đa 33 Trận!",
        delP: "Bạn muốn xóa {0} khỏi giải đấu?", errMinG: "Phải có ít nhất 1 Trận đấu!", delG: "Bạn có muốn xóa {0}?",
        confirmReset: "🚨 LÀM MỚI BẢNG ĐIỂM?\nMọi dữ liệu sẽ bị xóa và quay về trạng thái mặc định (4 VĐV, 9 Trận).",
        defPlayer: "VDV", defGame: "Game", timeCol: "Thành Tích", scoreCol: "Điểm"
      },
      en: {
        title: "SECOND-BASED SCORING SYSTEM", subtitle: "Designed and developed by koi",
        addPlayer: "Add Player", addMatch: "Add Match", reset: "Reset", export: "Export Excel",
        no: "No.", match: "MATCH", kingMap: "King Map", total: "TOTAL SCORE", leaderboard: "LEADERBOARD", pts: "PTS",
        errMaxP: "Maximum 6 players allowed!", errMinP: "Need at least 2 players!", errMaxG: "Maximum 33 matches allowed!",
        delP: "Remove {0} from the tournament?", errMinG: "Need at least 1 match!", delG: "Delete {0}?",
        confirmReset: "🚨 RESET SCOREBOARD?\nAll data will be wiped and returned to default (4 Players, 9 Matches).",
        defPlayer: "Player", defGame: "Match", timeCol: "Record", scoreCol: "Score"
      },
      cn: { 
        title: "秒数计分系统", subtitle: "由 koi 设计与开发", 
        addPlayer: "添加选手", addMatch: "添加比赛", reset: "重置", export: "导出表格", 
        no: "序号", match: "比赛", kingMap: "王牌赛道", total: "总分", leaderboard: "排行榜", pts: "分", 
        errMaxP: "最多允许 6 名选手！", errMinP: "至少需要 2 名选手！", errMaxG: "最多允许 33 场比赛！",
        delP: "是否将 {0} 移出比赛？", errMinG: "至少需要 1 场比赛！", delG: "确定要删除 {0} 吗？", confirmReset: "🚨 重置计分板？", 
        defPlayer: "选手", defGame: "比赛", timeCol: "成绩", scoreCol: "得分" 
      },
      tw: { 
        title: "秒數計分系統", subtitle: "由 koi 設計與開發", 
        addPlayer: "新增選手", addMatch: "新增比賽", reset: "重置", export: "匯出表格", 
        no: "序號", match: "比賽", kingMap: "王牌賽道", total: "總分", leaderboard: "排行榜", pts: "分", 
        errMaxP: "最多允許 6 名選手！", errMinP: "至少需要 2 名選手！", errMaxG: "最多允許 33 場比賽！",
        delP: "是否將 {0} 移出比賽？", errMinG: "至少需要 1 場比賽！", delG: "確定要刪除 {0} 嗎？", confirmReset: "🚨 重置計分板？", 
        defPlayer: "選手", defGame: "比賽", timeCol: "成績", scoreCol: "得分" 
      },
      th: { 
        title: "ระบบการนับคะแนนตามวินาที", subtitle: "ออกแบบและพัฒนาโดย koi", 
        addPlayer: "เพิ่มผู้เล่น", addMatch: "เพิ่มแข่ง", reset: "รีเซ็ต", export: "ส่งออก", 
        no: "ลำดับ", match: "การแข่งขัน", kingMap: "แผนที่คิง", total: "คะแนนรวม", leaderboard: "ตารางคะแนน", pts: "แต้ม", 
        errMaxP: "อนุญาตผู้เล่นสูงสุด 6 คน!", errMinP: "ต้องมีผู้เล่นอย่างน้อย 2 คน!", errMaxG: "อนุญาตการแข่งขันสูงสุด 33 นัด!",
        delP: "ลบ {0} ออกหรือไม่?", errMinG: "ต้องมีอย่างน้อย 1 นัด!", delG: "ลบ {0} หรือไม่?", confirmReset: "🚨 รีเซ็ตกระดานคะแนน?", 
        defPlayer: "ผู้เล่น", defGame: "เกม", timeCol: "เวลา", scoreCol: "คะแนน" 
      }
    };

    const NORMAL_TOP_SCORE = 11;
    const KING_TOP_SCORE = 12;
    const MAX_PLAYERS = 6;
    const MAX_GAMES = 33;

    const parseTime = (val) => {
      if (!val || val.toUpperCase() === 'X') return null;
      if (val.includes(':') || val.includes('.')) {
        let m = 0, s = 0, c = 0;
        const parts = val.replace(',', '.').split(/[:.]/);
        if (parts.length === 3) [m, s, c] = parts.map(Number);
        else if (parts.length === 2) [s, c] = parts.map(Number);
        else return null;
        if (isNaN(m) || isNaN(s) || isNaN(c)) return null;
        return (m * 60000) + (s * 1000) + (c * 10);
      }
      const digits = val.replace(/\D/g, '');
      if (!digits) return null;
      let m = 0, s = 0, c = 0;
      if (digits.length >= 5) {
        c = Number(digits.slice(-2)); s = Number(digits.slice(-4, -2)); m = Number(digits.slice(0, -4));
      } else if (digits.length >= 3) {
        c = Number(digits.slice(-2)); s = Number(digits.slice(0, -2));
      } else c = Number(digits);
      return (m * 60000) + (s * 1000) + (c * 10);
    };

    const formatTimeDisplay = (val) => {
      if (!val) return '';
      if (val.toUpperCase() === 'X') return 'X';
      const ms = parseTime(val);
      if (ms === null) return val; 
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const c = Math.floor((ms % 1000) / 10);
      return `${m}:${s.toString().padStart(2, '0')}.${c.toString().padStart(2, '0')}`;
    };

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('zsm_lang_v7') || 'vi');
      const t = TRANSLATIONS[lang];

      const [players, setPlayers] = useState(() => {
        const saved = localStorage.getItem('zsm_players_v7');
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        return [`${t.defPlayer} 1`, `${t.defPlayer} 2`, `${t.defPlayer} 3`, `${t.defPlayer} 4`];
      });

      const [games, setGames] = useState(() => {
        const saved = localStorage.getItem('zsm_games_v7');
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        return Array(9).fill(null).map((_, i) => ({
          id: Date.now() + i, name: `${t.defGame} ${i + 1}`, times: Array(4).fill('')
        }));
      });

      useEffect(() => {
        const allDefP = Object.values(TRANSLATIONS).map(tr => tr.defPlayer);
        const allDefG = Object.values(TRANSLATIONS).map(tr => tr.defGame);
        setPlayers(prev => prev.map(p => {
          for (let def of allDefP) {
            if (p.startsWith(def + ' ')) {
              const num = p.replace(def + ' ', '');
              if (!isNaN(num)) return `${t.defPlayer} ${num}`;
            }
          }
          return p;
        }));
        setGames(prev => prev.map(g => {
          for (let def of allDefG) {
            if (g.name.startsWith(def + ' ')) {
              const num = g.name.replace(def + ' ', '');
              if (!isNaN(num)) return { ...g, name: `${t.defGame} ${num}` };
            }
          }
          return g;
        }));
      }, [lang]);

      useEffect(() => { localStorage.setItem('zsm_lang_v7', lang); }, [lang]);
      useEffect(() => { localStorage.setItem('zsm_players_v7', JSON.stringify(players)); }, [players]);
      useEffect(() => { localStorage.setItem('zsm_games_v7', JSON.stringify(games)); }, [games]);

      const handleTimeChange = (gIndex, pIndex, val) => {
        const newGames = [...games]; newGames[gIndex].times[pIndex] = val; setGames(newGames);
      };
      const handleTimeBlur = (gIndex, pIndex) => {
        const newGames = [...games]; newGames[gIndex].times[pIndex] = formatTimeDisplay(newGames[gIndex].times[pIndex]); setGames(newGames);
      };

      const addPlayer = () => {
        if (players.length >= MAX_PLAYERS) return alert(t.errMaxP);
        setPlayers([...players, `${t.defPlayer} ${players.length + 1}`]);
        setGames(games.map(g => ({ ...g, times: [...g.times, ''] })));
      };
      const removePlayer = (pIndex) => {
        if (players.length <= 2) return alert(t.errMinP);
        if (confirm(t.delP.replace('{0}', players[pIndex]))) {
          setPlayers(players.filter((_, i) => i !== pIndex));
          setGames(games.map(g => ({ ...g, times: g.times.filter((_, i) => i !== pIndex) })));
        }
      };
      
      const addGame = () => {
        if (games.length >= MAX_GAMES) return alert(t.errMaxG);
        setGames([...games, { id: Date.now(), name: `${t.defGame} ${games.length + 1}`, times: Array(players.length).fill('') }]);
      };
      
      const removeGame = (gIndex) => {
        if (games.length <= 1) return alert(t.errMinG);
        if (confirm(t.delG.replace('{0}', games[gIndex].name))) setGames(games.filter((_, i) => i !== gIndex));
      };
      const clearAll = () => {
        if (confirm(t.confirmReset)) {
          setPlayers([`${t.defPlayer} 1`, `${t.defPlayer} 2`, `${t.defPlayer} 3`, `${t.defPlayer} 4`]);
          setGames(Array(9).fill(null).map((_, i) => ({ id: Date.now() + i, name: `${t.defGame} ${i + 1}`, times: Array(4).fill('') })));
        }
      };

      const getGameCalculations = (gameIndex, times) => {
        const parsed = times.map(parseTime);
        const valids = parsed.filter(t => t !== null);
        const bestTime = valids.length > 0 ? Math.min(...valids) : null;

        return parsed.map((timeMs, pIndex) => {
          const isKingMap = (gameIndex === pIndex + 1); 
          if (timeMs === null) return { score: 0, isBest: false, isKingMap, colorClass: 'text-slate-600 bg-slate-900/50', borderClass: 'border-transparent' };
          
          const isBest = (timeMs === bestTime);
          let score = 0, colorClass = 'text-cyan-400 bg-slate-800/80', borderClass = 'border-transparent';

          if (isBest) {
            score = isKingMap ? KING_TOP_SCORE : NORMAL_TOP_SCORE;
            colorClass = isKingMap ? 'text-red-100 bg-red-600 font-black shadow-[0_0_10px_rgba(220,38,38,0.4)]' : 'text-amber-950 bg-amber-400 font-black shadow-[0_0_10px_rgba(251,191,36,0.4)]';
            borderClass = isKingMap ? 'border-red-500/50 bg-red-950/20' : 'border-amber-500/50 bg-amber-950/20';
          } else {
            const diffSec = Math.floor((timeMs - bestTime) / 1000);
            score = Math.max(0, 10 - diffSec);
            if (score === 0) colorClass = 'text-slate-500 bg-slate-900/80'; 
          }
          return { score, isBest, isKingMap, colorClass, borderClass };
        });
      };

      const totals = useMemo(() => {
        const sums = Array(players.length).fill(0);
        games.forEach((g, gIdx) => getGameCalculations(gIdx, g.times).forEach((c, pIdx) => sums[pIdx] += c.score));
        return sums;
      }, [games, players]);

      const leaderboard = useMemo(() => {
        const sorted = players.map((name, i) => ({ name, score: totals[i], id: i })).sort((a, b) => b.score - a.score);
        let currentRank = 1;
        return sorted.map((item, index) => {
          if (index > 0 && item.score < sorted[index - 1].score) currentRank = index + 1; 
          return { ...item, rank: currentRank };
        });
      }, [players, totals]);

      // --- PROFESSIONAL EXCEL EXPORT (USING EXCELJS) ---
      const exportProfessionalExcel = async () => {
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('BangDiem');

        const centerStyle = { vertical: 'middle', horizontal: 'center' };
        const borderStyle = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };

        // 1. Title (Clean)
        const lastColNum = 2 + (players.length * 2);
        ws.mergeCells(1, 1, 1, lastColNum);
        const titleCell = ws.getCell('A1');
        titleCell.value = t.title;
        titleCell.font = { name: 'Arial', size: 18, bold: true };
        titleCell.alignment = centerStyle;

        // 2. Headers (Moved up)
        ws.mergeCells('A3:A4'); ws.getCell('A3').value = t.no;
        ws.mergeCells('B3:B4'); ws.getCell('B3').value = t.match;
        
        ws.getCell('A3').alignment = centerStyle; ws.getCell('A3').border = borderStyle; ws.getCell('A3').font = { bold: true };
        ws.getCell('B3').alignment = centerStyle; ws.getCell('B3').border = borderStyle; ws.getCell('B3').font = { bold: true };
        ws.getCell('A4').border = borderStyle; ws.getCell('B4').border = borderStyle; // For merged borders

        players.forEach((p, i) => {
          const startCol = 3 + (i * 2); // C, E, G...
          ws.mergeCells(3, startCol, 3, startCol + 1);
          const pCell = ws.getCell(3, startCol);
          pCell.value = p;
          pCell.fill = { type: 'pattern', pattern:'solid', fgColor:{argb:'FFDDEBF7'} };
          pCell.alignment = centerStyle; pCell.border = borderStyle; pCell.font = { bold: true };
          ws.getCell(3, startCol+1).border = borderStyle;

          const timeCell = ws.getCell(4, startCol);
          timeCell.value = t.timeCol; timeCell.alignment = centerStyle; timeCell.border = borderStyle; timeCell.font = { bold: true };
          
          const scoreCell = ws.getCell(4, startCol + 1);
          scoreCell.value = t.scoreCol; scoreCell.fill = { type: 'pattern', pattern:'solid', fgColor:{argb:'FFE2EFDA'} };
          scoreCell.alignment = centerStyle; scoreCell.border = borderStyle; scoreCell.font = { bold: true };
        });

        // 3. Data Rows
        let currentRow = 5;
        games.forEach((g, gIdx) => {
          ws.getCell(currentRow, 1).value = gIdx + 1; ws.getCell(currentRow, 1).alignment = centerStyle; ws.getCell(currentRow, 1).border = borderStyle;
          ws.getCell(currentRow, 2).value = g.name; ws.getCell(currentRow, 2).border = borderStyle;

          const calcs = getGameCalculations(gIdx, g.times);
          g.times.forEach((time, pIdx) => {
            const startCol = 3 + (pIdx * 2);
            const tCell = ws.getCell(currentRow, startCol);
            const sCell = ws.getCell(currentRow, startCol + 1);
            
            tCell.value = time || ''; tCell.alignment = centerStyle; tCell.border = borderStyle;
            sCell.value = time ? calcs[pIdx].score : 0; sCell.alignment = centerStyle; sCell.border = borderStyle; sCell.font = { bold: true };

            if (calcs[pIdx].isBest) {
              if (calcs[pIdx].isKingMap) {
                tCell.fill = { type: 'pattern', pattern:'solid', fgColor:{argb:'FFFF6666'} };
                tCell.font = { color: { argb: 'FF9C0006' }, bold: true };
              } else {
                tCell.fill = { type: 'pattern', pattern:'solid', fgColor:{argb:'FFFFFF99'} };
              }
            }
          });
          currentRow++;
        });

        // 4. Total Row
        ws.mergeCells(currentRow, 1, currentRow, 2);
        const totalLabel = ws.getCell(currentRow, 1);
        totalLabel.value = t.total; totalLabel.font = { bold: true }; totalLabel.alignment = { horizontal: 'right', vertical: 'middle' };
        totalLabel.border = borderStyle; ws.getCell(currentRow, 2).border = borderStyle;

        totals.forEach((total, pIdx) => {
          const startCol = 3 + (pIdx * 2);
          ws.mergeCells(currentRow, startCol, currentRow, startCol + 1);
          const tCell = ws.getCell(currentRow, startCol);
          tCell.value = total;
          tCell.fill = { type: 'pattern', pattern:'solid', fgColor:{argb:'FFFFF2CC'} };
          tCell.font = { bold: true, size: 12 }; tCell.alignment = centerStyle; tCell.border = borderStyle;
          ws.getCell(currentRow, startCol+1).border = borderStyle;
        });

        ws.getColumn(1).width = 6; ws.getColumn(2).width = 18;
        for(let i=3; i<=lastColNum; i+=2) { ws.getColumn(i).width = 12; ws.getColumn(i+1).width = 8; }

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        saveAs(blob, `ZSM_Leaderboard_${new Date().getTime()}.xlsx`);
      };

      return (
        <div className="min-h-screen relative overflow-x-hidden pb-20">
          
          {/* LANG SELECTOR */}
          <div className="absolute top-2 right-2 md:top-4 md:right-4 z-50 flex items-center gap-2 bg-slate-900/80 border border-slate-700 px-2 md:px-3 py-1.5 rounded-full backdrop-blur-md shadow-lg transition-transform hover:scale-105">
            <Globe size={14} className="text-slate-400 hidden sm:block" />
            <select value={lang} onChange={(e) => setLang(e.target.value)} className="bg-transparent text-slate-300 text-[10px] md:text-xs font-bold outline-none cursor-pointer appearance-none">
              <option value="vi">🇻🇳 VI</option><option value="en">🇬🇧 EN</option><option value="cn">🇨🇳 CN</option>
              <option value="tw">🇹🇼 TW</option><option value="th">🇹🇭 TH</option>
            </select>
          </div>

          {/* EFFECTS & RACING BACKGROUND */}
          <div className="fixed inset-0 pointer-events-none z-0">
            {/* 1. Racing Wallpaper Base (ZingSpeed Mobile) */}
            <div className="absolute inset-0 bg-[url('https://storage.googleapis.com/chat-staging-context-data/context-images/2e061801-6573-4ea2-8d74-c3c788ed0ef6.png')] bg-cover bg-center opacity-60"></div>
            {/* 2. Glassmorphism Dark Overlay (Ensure readability) */}
            <div className="absolute inset-0 bg-[#050510]/85 backdrop-blur-sm"></div>
            {/* 3. Cyberpunk Grid Line */}
            <div className="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.05)_1px,transparent_1px)] bg-[size:50px_50px] [transform:perspective(1000px)_rotateX(60deg)] origin-bottom animate-[pulse_4s_ease-in-out_infinite]"></div>
            {/* 4. Neon Orbs */}
            <div className="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-red-600/20 blur-[120px] md:blur-[180px] rounded-full mix-blend-screen animate-[pulse_5s_ease-in-out_infinite]"></div>
            <div className="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-blue-600/20 blur-[120px] md:blur-[180px] rounded-full mix-blend-screen animate-[pulse_6s_ease-in-out_infinite]"></div>
          </div>

          <div className="relative z-10 p-2 md:p-8 max-w-[1400px] mx-auto">
            
            <header className="mb-6 md:mb-8 text-center animate-slide-up mt-8 md:mt-0">
              <div className="inline-flex items-center gap-2 md:gap-4 mb-1 md:mb-2 hover:scale-105 transition-transform duration-300">
                <Flag className="w-5 h-5 md:w-8 md:h-8 text-red-500 italic transform -skew-x-12 hidden sm:block" />
                <h1 className="text-xl sm:text-3xl md:text-5xl font-black italic tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-amber-500 to-yellow-500 uppercase drop-shadow-[0_0_15px_rgba(220,38,38,0.5)] cursor-default" style={{ transform: 'skewX(-10deg)' }}>
                  {t.title}
                </h1>
                <Flag className="w-5 h-5 md:w-8 md:h-8 text-red-500 italic transform -skew-x-12 hidden sm:block" />
              </div>
              <p className="text-slate-400 text-[10px] md:text-sm tracking-[0.1em] md:tracking-[0.2em] uppercase font-bold">{t.subtitle}</p>
              
              {/* BUTTONS WITH 3D HOVER */}
              <div className="mt-6 flex flex-wrap justify-center gap-2 md:gap-4 relative z-20">
                <button onClick={addPlayer} className="flex items-center justify-center gap-1 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 bg-blue-900/50 border border-blue-500/50 text-blue-300 hover:bg-blue-600 hover:text-white hover:-translate-y-1 hover:shadow-[0_8px_20px_rgba(59,130,246,0.4)] active:scale-95 font-bold rounded transition-all duration-300 uppercase text-[10px] md:text-xs tracking-wider flex-1 sm:flex-none">
                  <Plus size={14}/> <span className="hidden sm:inline">{t.addPlayer}</span>
                </button>
                <button onClick={addGame} className="flex items-center justify-center gap-1 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 bg-purple-900/50 border border-purple-500/50 text-purple-300 hover:bg-purple-600 hover:text-white hover:-translate-y-1 hover:shadow-[0_8px_20px_rgba(168,85,247,0.4)] active:scale-95 font-bold rounded transition-all duration-300 uppercase text-[10px] md:text-xs tracking-wider flex-1 sm:flex-none">
                  <Plus size={14}/> <span className="hidden sm:inline">{t.addMatch}</span>
                </button>
                <div className="w-full sm:w-px sm:h-10 bg-slate-700/50 my-1 sm:my-0"></div>
                <button onClick={exportProfessionalExcel} className="flex items-center justify-center gap-1 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 bg-green-900/50 border border-green-500/50 text-green-300 hover:bg-green-600 hover:text-white hover:-translate-y-1 hover:shadow-[0_8px_20px_rgba(34,197,94,0.4)] active:scale-95 font-bold rounded transition-all duration-300 uppercase text-[10px] md:text-xs tracking-wider flex-1 sm:flex-none">
                  <Download size={14}/> {t.export}
                </button>
                <button onClick={clearAll} className="flex items-center justify-center gap-1 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 bg-slate-900 border border-slate-700 text-slate-300 hover:text-red-400 hover:border-red-500 hover:bg-red-950 hover:-translate-y-1 hover:shadow-[0_8px_20px_rgba(239,68,68,0.4)] active:scale-95 font-bold rounded transition-all duration-300 uppercase text-[10px] md:text-xs tracking-wider flex-1 sm:flex-none group">
                  <RefreshCcw size={14} className="group-hover:-rotate-180 transition-transform duration-700"/> {t.reset}
                </button>
              </div>
            </header>

            <div className="grid lg:grid-cols-4 gap-4 md:gap-6">
              
              {/* MAIN TABLE (Responsive + Sticky Header) */}
              <div className="lg:col-span-3 bg-slate-900/70 backdrop-blur-xl border border-slate-700/50 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] overflow-hidden animate-slide-up delay-100 flex flex-col max-h-[75vh]">
                <div className="overflow-x-auto overflow-y-auto custom-scrollbar flex-1">
                  <table className="w-full text-xs md:text-sm border-collapse">
                    <thead className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md shadow-md border-b border-slate-700">
                      <tr>
                        <th className="px-1 md:px-2 py-3 text-center w-8 md:w-12 text-slate-500 font-bold">{t.no}</th>
                        <th className="px-1 md:px-2 py-3 text-left w-24 md:w-40 tracking-widest text-slate-300 font-bold whitespace-nowrap">{t.match}</th>
                        {players.map((p, i) => (
                          <th key={i} className="px-1 md:px-2 py-3 min-w-[80px] md:min-w-[140px] relative group">
                            <input type="text" value={p} onChange={(e) => { const n=[...players]; n[i]=e.target.value; setPlayers(n); }}
                              className="w-full bg-transparent border-b-2 border-slate-700 focus:border-red-500 outline-none text-center pb-1 text-sm md:text-lg text-white font-bold transition-all duration-300 hover:border-slate-500"
                            />
                            <button onClick={() => removePlayer(i)} className="absolute top-1 right-1 p-1 text-slate-500 hover:text-white hover:bg-red-500 opacity-100 md:opacity-0 group-hover:opacity-100 hover:scale-110 active:scale-90 transition-all bg-slate-800 rounded-full border border-slate-700 z-30 shadow-lg">
                              <XIcon size={10}/>
                            </button>
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/50">
                      {games.map((game, gIndex) => {
                        const calcs = getGameCalculations(gIndex, game.times);
                        return (
                          <tr key={game.id} className="hover:bg-slate-800/80 hover:shadow-[0_5px_15px_rgba(0,0,0,0.3)] hover:-translate-y-[1px] transition-all duration-300 group relative z-10">
                            <td className="px-1 md:px-2 py-2 text-center text-slate-600 font-bold font-mono">{gIndex + 1}</td>
                            <td className="px-1 md:px-2 py-2 relative">
                              <div className="flex items-center gap-1 md:gap-2">
                                <input type="text" value={game.name} onChange={(e) => { const n=[...games]; n[gIndex].name=e.target.value; setGames(n); }}
                                  className="w-full bg-slate-950/50 border border-slate-800 rounded px-1 py-1 text-slate-400 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none font-bold text-[10px] md:text-xs tracking-wider transition-all duration-300 hover:border-slate-600"
                                />
                                <button onClick={() => removeGame(gIndex)} className="text-slate-600 hover:text-red-500 opacity-100 md:opacity-0 group-hover:opacity-100 hover:scale-110 transition-all flex-shrink-0 p-1">
                                  <Trash2 size={14}/>
                                </button>
                              </div>
                            </td>
                            
                            {game.times.map((time, pIndex) => {
                              const { score, isKingMap, colorClass, borderClass } = calcs[pIndex];
                              return (
                                <td key={pIndex} className="px-1 md:px-2 py-2">
                                  <div className={`relative flex flex-col gap-0.5 md:gap-1 p-1 md:p-2 rounded md:rounded-lg border transition-all duration-300 hover:bg-white/[0.05] ${borderClass}`}>
                                    {isKingMap && (
                                      <div className="absolute -top-2 md:-top-3 left-1/2 -translate-x-1/2 flex items-center gap-0.5 bg-red-600 px-1 md:px-2 rounded text-[7px] md:text-[9px] uppercase font-bold tracking-widest text-white shadow-[0_0_15px_#dc2626] z-10 whitespace-nowrap animate-pulse">
                                        <Crown size={8} className="md:w-[10px] md:h-[10px]" /> <span className="hidden sm:inline">{t.kingMap}</span>
                                      </div>
                                    )}
                                    <input type="text" value={time} onChange={(e) => handleTimeChange(gIndex, pIndex, e.target.value)} onBlur={() => handleTimeBlur(gIndex, pIndex)}
                                      placeholder="X"
                                      className={`w-full text-center bg-black/40 border border-slate-700 rounded px-1 py-1 outline-none tracking-widest text-xs md:text-sm transition-all duration-300 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 focus:shadow-[0_0_15px_rgba(34,211,238,0.3)] hover:border-slate-500 hover:bg-black/60 ${time ? 'text-white' : 'text-slate-600'}`}
                                    />
                                    <div className={`mt-0.5 text-center py-0.5 rounded text-[10px] md:text-sm tracking-wider font-bold ${colorClass}`}>
                                      {time ? `+${score}` : '-'}
                                    </div>
                                  </div>
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                      
                      <tr className="bg-gradient-to-r from-red-900/30 to-blue-900/30 border-t-4 border-red-600 sticky bottom-0 z-20 backdrop-blur-lg">
                        <td colSpan={2} className="px-2 md:px-4 py-3 md:py-6 text-right font-black text-red-500 uppercase tracking-widest text-xs md:text-sm">
                          {t.total}
                        </td>
                        {totals.map((total, i) => (
                          <td key={i} className="px-1 md:px-2 py-3 md:py-6 text-center">
                            <span className="text-xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400 drop-shadow-[0_0_15px_rgba(255,255,255,0.4)] hover:scale-110 inline-block transition-transform duration-300 cursor-default">
                              {total}
                            </span>
                          </td>
                        ))}
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              {/* SIDEBAR: LEADERBOARD */}
              <div className="lg:col-span-1 animate-slide-up delay-200 order-first lg:order-last">
                <div className="bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 rounded-xl overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.6)] hover:shadow-[0_10px_40px_rgba(220,38,38,0.15)] transition-shadow duration-500">
                  <div className="bg-slate-950 px-4 md:px-6 py-3 md:py-5 border-b border-slate-800 flex items-center justify-between">
                    <h2 className="font-black text-white tracking-[0.1em] uppercase italic transform skew-x-[-10deg] text-sm md:text-base cursor-default">{t.leaderboard}</h2>
                    <Flame className="text-red-500 animate-pulse w-4 h-4 md:w-6 md:h-6" />
                  </div>
                  
                  <div className="p-2 md:p-4 space-y-2 md:space-y-3 flex flex-row lg:flex-col overflow-x-auto lg:overflow-x-visible hide-scrollbar gap-2 lg:gap-0">
                    {leaderboard.map((item) => {
                      const isTop1 = item.rank === 1 && item.score > 0;
                      const isTop2 = item.rank === 2 && item.score > 0;
                      const isTop3 = item.rank === 3 && item.score > 0;
                      
                      return (
                        <div key={item.id} className={`relative flex items-center justify-between p-2 md:p-3 rounded border min-w-[140px] lg:min-w-0 flex-shrink-0 transition-all duration-300 hover:scale-105 hover:z-10 hover:shadow-[0_10px_20px_rgba(0,0,0,0.5)] hover:bg-slate-800/90 cursor-default ${isTop1 ? 'bg-amber-500/10 border-amber-500 shadow-[inset_0_0_15px_rgba(251,191,36,0.15)]' : isTop2 ? 'bg-slate-400/10 border-slate-400' : isTop3 ? 'bg-orange-700/10 border-orange-600' : 'bg-slate-950/50 border-slate-800 hover:border-slate-600'}`}>
                          <div className={`absolute left-0 top-0 bottom-0 w-1 rounded-l ${isTop1?'bg-amber-400':isTop2?'bg-slate-300':isTop3?'bg-orange-500':'bg-slate-700'}`}></div>
                          <div className="flex items-center gap-2 md:gap-3 pl-1 md:pl-2">
                            <div className={`w-6 h-6 md:w-8 md:h-8 rounded bg-black/50 border flex items-center justify-center font-black italic text-xs md:text-sm shadow-inner ${isTop1 ? 'text-amber-400 border-amber-500/50 shadow-[0_0_15px_rgba(251,191,36,0.4)]' : isTop2 ? 'text-slate-300 border-slate-400/50' : isTop3 ? 'text-orange-400 border-orange-500/50' : 'text-slate-600 border-slate-700'}`}>
                              #{item.rank}
                            </div>
                            <span className={`font-bold tracking-wider text-xs md:text-sm truncate max-w-[60px] md:max-w-[100px] ${isTop1 ? 'text-white' : 'text-slate-300'}`}>
                              {item.name}
                            </span>
                          </div>
                          <div className="flex items-baseline gap-0.5 md:gap-1">
                            <span className={`text-lg md:text-2xl font-black ${isTop1 ? 'text-amber-400 drop-shadow-[0_0_10px_rgba(251,191,36,0.8)]' : 'text-white'}`}>
                              {item.score}
                            </span>
                            <span className="text-[8px] md:text-[10px] text-slate-500 font-bold tracking-widest uppercase hidden sm:inline">{t.pts}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
